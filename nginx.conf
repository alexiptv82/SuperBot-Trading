server {
    listen 80;
    # L'IP resta per compatibilita'/debug diretto (resta solo HTTP, non
    # c'e' un certificato per l'IP). Il dominio DuckDNS serve perche' nginx
    # smisti correttamente le richieste a questo vhost invece di farle
    # cadere nel server block di un altro sito sulla stessa VPS (es.
    # hitvprime, che ha un default_server implicito e redirige tutto cio'
    # che non riconosce). Niente redirect forzato a HTTPS qui: lasciamo
    # che Let's Encrypt possa sempre verificare il dominio via HTTP per i
    # rinnovi automatici, senza la complessita' di un redirect condizionale.
    server_name 51.91.109.45 superbot-trading.duckdns.org;

    root /opt/superbot/frontend/build;
    index index.html;

    # Richiesto da Let's Encrypt (metodo webroot) per verificare il
    # dominio, sia per l'emissione iniziale che per i rinnovi automatici.
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name superbot-trading.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/superbot-trading.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superbot-trading.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/superbot/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
