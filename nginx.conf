server {
    listen 80;
    # L'IP resta per compatibilita'/debug diretto; il dominio DuckDNS e'
    # quello che serve perche' nginx smisti correttamente le richieste a
    # questo vhost invece di farle cadere nel server block di un altro
    # sito sulla stessa VPS (es. hitvprime, che ha un default_server
    # implicito e redirige tutto cio' che non riconosce).
    server_name 51.91.109.45 superbot-trading.duckdns.org;

    root /opt/superbot/frontend/build;
    index index.html;

    # Richiesto da Let's Encrypt (metodo webroot) per verificare il
    # dominio, sia per l'emissione iniziale che per i rinnovi automatici.
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /api {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
