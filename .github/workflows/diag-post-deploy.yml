name: Verifica dopo deploy (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica (nessun segreto viene stampato)
        run: |
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }
          cd /opt/superbot
          note "git: file dati tracciati (deve essere vuoto)" "[$(git ls-files data)] stato data: [$(git status --short data | head -3)] commit: $(git log -1 --format='%h')"
          note "db live" "$(stat -c '%y %s byte' data/superbot.db)"
          note "copie di sicurezza" "$(ls -la --time-style=long-iso /opt/superbot-backups | awk 'NR>1 {print $6, $7, $5, $8}' | tr '\n' ';')"
          RES=$(python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect('file:/opt/superbot/data/superbot.db?mode=ro', uri=True)
          out = []
          out.append('auth_settings: hash_impostato=%s cambiata_il=%s token_version=%s' % con.execute('select password_hash is not null, password_changed_at, token_version from auth_settings where id=1').fetchone())
          out.append('righe audit_log (prima del deploy erano 3 auth_failed): %d' % con.execute('select count(*) from audit_log').fetchone()[0])
          out.append('chiave jwt presente: %s' % bool(con.execute('select jwt_secret from auth_settings where id=1').fetchone()[0]))
          print('\n'.join(out))
          PY
          )
          note "Contenuto del db dopo il deploy" "$RES"
          note "main.js servito" "$(ls /opt/superbot/frontend/build/static/js/main.*.js | xargs -n1 basename)"
          note "HTTPS: webauthn/status" "$(curl -sS -m 10 -w ' [HTTP %{http_code}]' https://superbot-trading.duckdns.org/api/auth/webauthn/status)"
          note "HTTPS: credenziali impronta senza sessione (deve dare 401)" "$(curl -sS -m 10 -o /dev/null -w 'HTTP %{http_code}' https://superbot-trading.duckdns.org/api/auth/webauthn/credentials)"
          note "Container" "$(docker ps --filter name=^superbot$ --format '{{.Names}} {{.Status}}')"
          REMOTE
