name: Verifica dopo deploy (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica (nessun segreto viene stampato, nessun messaggio Telegram viene inviato)
        run: |
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }
          note "main.js servito" "$(ls /opt/superbot/frontend/build/static/js/main.*.js | xargs -n1 basename) baseURL: $(grep -oh 'baseURL:[^,}]\{0,40\}' /opt/superbot/frontend/build/static/js/main.*.js | tr '\n' ' ')"
          note "service worker servito" "$(curl -sS -m 10 https://superbot-trading.duckdns.org/service-worker.js | grep -c 'superbot-shell-v2') riga/e con superbot-shell-v2"
          note "forgot/confirm senza codice (deve dare 401)" "$(curl -sS -m 10 -w ' [HTTP %{http_code}]' -X POST -H 'Content-Type: application/json' -d '{"code":"00000000","new_password":"x"}' https://superbot-trading.duckdns.org/api/auth/forgot/confirm 2>&1)"
          note "login con body vuoto (422)" "$(curl -sS -m 10 -o /dev/null -w 'HTTP %{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://superbot-trading.duckdns.org/api/auth/login)"
          # Telegram: solo letture (getMe, getChat), nessun messaggio inviato
          TOKEN=$(grep '^TELEGRAM_BOT_TOKEN=' /opt/superbot/backend/.env | cut -d= -f2-)
          CHAT=$(grep '^TELEGRAM_CHAT_ID=' /opt/superbot/backend/.env | cut -d= -f2-)
          ME=$(curl -sS -m 10 "https://api.telegram.org/bot${TOKEN}/getMe" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("ok=%s" % d.get("ok"))' 2>&1)
          CH=$(curl -sS -m 10 "https://api.telegram.org/bot${TOKEN}/getChat?chat_id=${CHAT}" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("ok=%s" % d.get("ok"))' 2>&1)
          note "Telegram dal server" "token valido (getMe): ${ME} | chat raggiungibile (getChat): ${CH}"
          note "Container" "$(docker ps --filter name=^superbot$ --format '{{.Names}} {{.Status}}')"
          REMOTE
