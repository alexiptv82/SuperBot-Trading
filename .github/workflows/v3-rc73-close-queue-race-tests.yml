name: RC73 PAPER close mutex, no duplicate commands and no trade execution (CI)
on:
  push:
    branches: [work/v3-rc73-manual-close-idempotency-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-close-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: No double taps and no writes on wrong or stopped bot (synthetic data only)
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          V3_CUTOVER_READONLY: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_classic_manual_close_mutex.py \
            backend/tests/test_v3_classic_exit_only.py \
            backend/tests/test_v3_classic_close_offline.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_cutover_gate.py
      - name: Syntax and bounds checks
        run: |
          python -m py_compile backend/desk_view.py backend/desk/exit_only.py backend/desk_api.py
          python - <<'PY'
          from pathlib import Path
          a=Path('backend/desk_view.py').read_text()
          b=Path('backend/desk/exit_only.py').read_text()
          assert '_manual_request_lock(data_dir)' in a
          assert '("reset.flag", "reset.flag.work", "close_position.flag", "close_position.flag.work")' in a
          assert 'LOCK_EX | fcntl.LOCK_NB' in b
          print('RC73_QUEUE_LOCK_SAFETY_CONTRACT=PASS')
          PY
