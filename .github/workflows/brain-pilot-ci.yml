name: Brain Pilot V1 offline tests
on:
  push:
    branches: [work/brain-pilot-v1, work/brain-pilot-stateful-upgrader, work/brain-learning-v1]
    paths:
      - "backend/director/brain_pilot/**"
      - "backend/tests/test_brain_pilot*.py"
      - "backend/tests/test_brain_pilot_install.py"
      - "deploy/scripts/brain_pilot_install.py"
      - "deploy/scripts/brain_pilot_upgrade.py"
      - ".github/workflows/brain-pilot-upgrade.yml"
      - ".github/workflows/brain-pilot-install.yml"
      - "Dockerfile.brainpilot"
      - ".github/workflows/brain-pilot-ci.yml"
  pull_request:
    branches: [rule-pool]
    paths: ["backend/director/brain_pilot/**", "backend/tests/test_brain_pilot*.py", "deploy/scripts/brain_pilot_install.py", "deploy/scripts/brain_pilot_upgrade.py", ".github/workflows/brain-pilot-install.yml", ".github/workflows/brain-pilot-upgrade.yml", "Dockerfile.brainpilot"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy==2.2.6
      - name: Offline unit and integration tests
        env:
          PYTHONPATH: backend
          DESK_MODE: paper
        run: python -m unittest discover -s backend/tests -p 'test_brain_pilot*.py' -v
      - name: Docker build and isolated import smoke test (no keys, no network calls)
        if: matrix.python-version == '3.11'
        run: |
          docker build -f Dockerfile.brainpilot -t brain-pilot-ci:test .
          docker run --rm --read-only --cap-drop ALL --network none brain-pilot-ci:test python -c "from director.brain_pilot.pilot import config; from director.brain_pilot.portfolio import Portfolio; assert config().daily_stop == .20; assert Portfolio().account.name == 'brain-paper'"
      - name: Actual container migration probe on copy of five-position account
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: backend
          BRAIN_TEST_IMAGE: brain-pilot-ci:test
        run: python -m unittest discover -s backend/tests -p test_brain_pilot_upgrader.py -v
