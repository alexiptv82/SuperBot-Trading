name: RC73 independent PAPER close-only production verification (READ ONLY)
on:
  push:
    branches: [work/v3-rc73-manual-close-idempotency-20261107]
    paths: ['.github/workflows/v3-rc73-postdeploy-single-close-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Verify web/auth/gates, 6+2 untouched, active exit-only and previous release
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:sNv9lNqWbZFf2Pm5ChIubeQKV5TzKfUWNlGPzCJg96s
          command_timeout: 95s
          script: |
            set -eu
            python3 - <<'PY'
            import hashlib,json,sqlite3,subprocess,time,urllib.request,urllib.error
            from pathlib import Path
            def check(label,cond):
                print('RC73_'+label+'='+str(bool(cond)))
                return bool(cond)
            def docker(name):
                p=subprocess.run(['docker','inspect',name],capture_output=True,text=True,timeout=8)
                return json.loads(p.stdout)[0] if p.returncode==0 else {}
            def sha(file):
                h=hashlib.sha256()
                with Path(file).open('rb') as f:
                    for chunk in iter(lambda:f.read(1_048_576),b''):h.update(chunk)
                return h.hexdigest()
            def http(url,method='GET'):
                try:
                    req=urllib.request.Request('http://127.0.0.1:8002'+url,method=method)
                    with urllib.request.urlopen(req,timeout=5) as r:return r.status
                except urllib.error.HTTPError as e:return e.code
                except Exception:return 0
            app=docker('superbot')
            old=docker('superbot-rc73-previous')
            env=dict(x.split('=',1) for x in app.get('Config',{}).get('Env',[]) if '=' in x)
            ok=True
            for label,condition in (
                ('WEB_RUNNING',app.get('State',{}).get('Running') is True),
                ('OLD_WEB_STOPPED',old.get('State',{}).get('Running') is False),
                ('OLD_FRONTEND_PRESERVED',Path('/opt/superbot-web/build.rc73-previous/index.html').is_file()),
                ('WEB_BUILD_VERIFIED',sha('/opt/superbot-web/build/index.html') ==
                  sha('/opt/superbot-v3-rc73-release/frontend/build/index.html')),
                ('READONLY_GATE_ENABLED',env.get('V3_CUTOVER_READONLY')=='1'),
                ('ONLY_SINGLE_PAPER_CLOSE_OPT_IN',env.get('V3_ALLOW_CLASSIC_SINGLE_CLOSE')=='1'),
                ('PAPER_ONLY',env.get('TRADING_MODE')=='paper' and env.get('DESK_MODE')=='paper'),
                ('TELEGRAM_DISABLED',env.get('TELEGRAM_COMMANDS_ENABLED')=='false'),
                ('BRAIN_PAUSED',Path('/opt/superbot-v3-paper-runs/brain-v3-rc20261106/pause.flag').exists()),
                ('WEB_HEALTH_200',http('/api/health')==200),
                ('OVERVIEW_AUTH_401',http('/api/v3/overview')==401),
                ('SINGLE_FALCO_REQUIRES_AUTH',http('/api/desk/close-position','POST')==401),
                ('SINGLE_TORO_REQUIRES_AUTH',http('/api/desk/bull/close-position','POST')==401),
                ('CLOSE_ALL_BLOCKED',http('/api/desk/close-all','POST')==423),
                ('CLOSE_ALL_BULL_BLOCKED',http('/api/desk/bull/close-all','POST')==423),
                ('RESUME_BLOCKED',http('/api/desk/resume','POST')==423),
                ('RESET_BLOCKED',http('/api/desk/reset-portfolio','POST')==423),
                ('BRAIN_CLOSE_BLOCKED',http('/api/v3/brain/close','POST')==423),
            ):
                ok &= check(label,condition)
            backup=sorted(Path('/opt/superbot-backups').glob('rc73-app-db-*/superbot.db'))
            session=False
            if backup:
                try:
                    with sqlite3.connect('file:'+str(backup[-1])+'?mode=ro',uri=True) as previous, sqlite3.connect('file:/opt/superbot/data/superbot.db?mode=ro',uri=True) as current:
                        q='SELECT password_hash,token_version,jwt_secret FROM auth_settings WHERE id=1'
                        session=bool(previous.execute(q).fetchone()==current.execute(q).fetchone())
                except (OSError,sqlite3.Error): pass
            ok &= check('AUTH_JWT_PASSWORD_UNCHANGED',session)
            snap=Path('/opt/superbot-backups/rc69-paper-legacy-20261107T110255Z-142218')
            for p,label,n in [('hawk','FALCO',6),('bull','TORO',2)]:
                d=Path('/opt/superbot-desk-data')/p
                container=docker('superbot-desk-'+p)
                try:
                    state=json.loads((d/'state_v2.json').read_text())
                    positions=state['main']['positions']
                except (ValueError,OSError,KeyError,TypeError):
                    positions=None
                unit='superbot-v3-'+label.lower()+'-exit.service'
                is_active=subprocess.run(['systemctl','is-active','--quiet',unit]).returncode==0
                is_disabled=subprocess.run(['systemctl','is-enabled',unit],capture_output=True,text=True).stdout.strip()=='disabled'
                try:
                    hb=json.loads((d/'exit_only_heartbeat.json').read_text())
                    ready=(hb.get('mode')=='paper-exit-only' and hb.get('portfolio')==p
                           and hb.get('ready') is True
                           and 0<=time.time()-hb.get('ts',0)<12)
                except (OSError,ValueError,TypeError):
                    ready=False
                files=('state_v2.json','trade_history.jsonl','learning_log.jsonl','lessons.md')
                same=all(sha(d/f)==sha(snap/p/f) for f in files)
                no_pending=not any((d/x).exists() for x in (
                    'close_position.flag','close_position.flag.work','reset.flag','reset.flag.work'))
                safe=(type(positions) is dict and len(positions)==n
                      and container.get('State',{}).get('Running') is False
                      and container.get('HostConfig',{}).get('RestartPolicy',{}).get('Name')=='no'
                      and (d/'pause.flag').is_file() and is_active and is_disabled
                      and ready and same and no_pending)
                ok &= check(label+'_EXIT_READY_HISTORY_UNCHANGED',safe)
            actual=Path('/opt/superbot-v3-rc70-stage/backend/desk/exit_only.py').read_text()
            ok &= check('WORKER_NEW_ATOMIC_LOCK_LOADED','request_writer_busy' in actual)
            print('RC73_INDEPENDENT_POSTDEPLOY='+('PASS' if ok else 'FAIL'))
            if not ok:raise SystemExit(2)
            PY
