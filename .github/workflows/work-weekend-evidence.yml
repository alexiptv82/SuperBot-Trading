name: Work - weekend loss audit verified encrypted evidence
on:
  push:
    branches: [work/backend-singapore-audit]
    paths: ['.github/workflows/work-weekend-evidence.yml']
permissions:
  contents: read
concurrency:
  group: superbot-weekend-audit
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Create and verify new snapshots, capture sources and logs, emit encrypted evidence only
        env:
          OLD_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SG_KNOWN_HOSTS: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: python deploy/weekend-audit/collect_runner.py
