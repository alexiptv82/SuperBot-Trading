name: Work - verify persistent app link and finalize handoff
on:
  push:
    branches: [work/backend-singapore-audit]
    paths: ['.github/workflows/work-app-link-finalize.yml']
permissions:
  contents: read
concurrency:
  group: superbot-app-link-migration
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nine isolated regression tests
        run: |
          python -m pip install fastapi==0.110.0 httpx==0.27.0
          python -m unittest discover -s deploy/work-audit/app_link -p test_link.py -v
          python -m unittest discover -s deploy/work-audit -p test_remote_ops.py -v
      - name: Verify live read paths, preserve active restricted key and record persistence
        env:
          OLD_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SG_KNOWN_HOSTS: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: python deploy/work-audit/finalize_app_link.py
