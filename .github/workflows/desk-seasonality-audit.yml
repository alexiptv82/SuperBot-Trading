name: Stagionalità A/B — solo punteggio (sola lettura)
on:
  push:
    branches: [rule-pool]
    paths: ["deploy/desk-seasonality.trigger"]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin commit del workflow
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q origin rule-pool
          git merge-base --is-ancestor "$SHA" origin/rule-pool
      - name: Score-only audit sul VPS (nessuna modifica ai bot)
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/id_sg /tmp/remote-seasonality.sh' EXIT
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/id_sg
          chmod 600 ~/.ssh/id_sg
          cat > ~/.ssh/known_hosts_sg <<'KH'
          51.79.205.82 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBDeMovQlEMs3Omccc1vMwPER3OkPLAtPltv11PjcbjSLDmutufUUwzqsRErqSo4XItzxdT3Z8nKCGZ/6zIFnQi4=
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          KH
          ssh_sg() {
            ssh -i ~/.ssh/id_sg -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts_sg" -o ConnectTimeout=30 \
              root@51.79.205.82 "$@"
          }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          cat > /tmp/remote-seasonality.sh <<'REMOTE'
          set -euo pipefail
          D="$(mktemp -d /tmp/superbot-seasonality.XXXXXX)"
          trap 'rm -rf "$D"' EXIT
          git clone -q -b rule-pool https://github.com/alexiptv82/SuperBot-Trading.git "$D"
          cd "$D"
          git fetch -q origin rule-pool
          git merge-base --is-ancestor SHA_TOKEN origin/rule-pool
          git reset -q --hard SHA_TOKEN
          test "$(git rev-parse HEAD)" = SHA_TOKEN

          before="$(docker inspect --format '{{.Name}}|{{.Id}}|{{.Image}}|{{.State.StartedAt}}' superbot-desk-hawk superbot-desk-bull)"
          for bot in hawk bull; do
            docker inspect "$([ "$bot" = hawk ] && echo superbot-desk-hawk || echo superbot-desk-bull)" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'DESK_MODE=paper'
            input="/opt/superbot-desk-data/$bot/learning_log.jsonl"
            test -f "$input" && test ! -L "$input"
            input_sha="$(sha256sum "$input" | cut -d' ' -f1)"
            for threshold in 60 63; do
              result="$(docker run --rm --name "superbot-seasonality-RUN_ID_TOKEN-$bot-$threshold" \
                --network none --read-only --tmpfs /tmp:size=64m --cap-drop ALL \
                --cap-add DAC_READ_SEARCH --security-opt no-new-privileges \
                --memory 512m --cpus 1 --pids-limit 64 \
                -v "$D:/src:ro" -v /opt/superbot-desk-data:/data:ro \
                -e PYTHONDONTWRITEBYTECODE=1 superbot-desk \
                python /src/deploy/scripts/seasonality_audit.py \
                --snapshot "/data/$bot/learning_log.jsonl" --sha256 "$input_sha" \
                --threshold "$threshold" \
                --reviewed-code-version 5818aee --reviewed-code-version b4709d1 \
                --reviewed-code-version fa3e220 --reviewed-code-version b6b9911 \
                --reviewed-code-version 4aabeb8 --paper-confirmed)"
              printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("scope") == "recorded_readings_only_not_trades_or_pnl"'
              printf 'bot=%s score_threshold_scenario=%s %s\n' "$bot" "$threshold" "$result"
            done
            test "$input_sha" = "$(sha256sum "$input" | cut -d' ' -f1)"
          done
          after="$(docker inspect --format '{{.Name}}|{{.Id}}|{{.Image}}|{{.State.StartedAt}}' superbot-desk-hawk superbot-desk-bull)"
          test "$before" = "$after"
          echo "BOT_CONTAINER_INVARIANCE=PASS"
          REMOTE
          sed -i -e "s/SHA_TOKEN/$SHA/g" -e "s/RUN_ID_TOKEN/$RUN_ID/g" /tmp/remote-seasonality.sh
          OUT="$(ssh_sg "$(cat /tmp/remote-seasonality.sh)")"
          rm -f /tmp/remote-seasonality.sh
          printf '%s\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$OUT" | while IFS= read -r line; do
            safe="$(printf '%s' "$line" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | cut -c1-6000)"
            echo "::notice title=Stagionalità score-only::$safe"
          done
          printf '%s\n' "$OUT" | grep -q 'BOT_CONTAINER_INVARIANCE=PASS'
