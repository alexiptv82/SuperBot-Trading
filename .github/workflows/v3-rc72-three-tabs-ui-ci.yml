name: RC72 Brain in Classic + Trade UI parity (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc72-brain-in-classic-trade-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Brain adapter and three-wallet navigation/UI regression
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand
      - name: Create production dashboard bundle
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Brain API pagination and readonly parity, existing route regressions
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          V3_CUTOVER_READONLY: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_brain_trade_pagination.py \
            backend/tests/test_v3_dashboard_unified.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_cutover_gate.py
