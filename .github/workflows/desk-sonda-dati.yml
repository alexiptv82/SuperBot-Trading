name: Sonda dati dal vivo - trend 1d e OI/long-short (SOLA LETTURA, nessun bot toccato)

# Prova il codice NUOVO di un commit di rule-pool contro i dati veri di Bitget, dentro un contenitore usa-e-getta
# dell'immagine dei bot (codice montato in sola lettura, nessuna chiave, nessun dato dei bot, nessun ordine).
# NON riavvia ne' sostituisce nulla: Hawk e Bull continuano con il codice di prima.
# Parte SOLO quando cambia deploy/desk-sonda-dati.trigger con la riga "sha=<40 caratteri>".
on:
  push:
    branches: [rule-pool]
    paths: ["deploy/desk-sonda-dati.trigger"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Commit da provare
        id: sha
        run: |
          set -e
          WANT="$(grep -E '^sha=' deploy/desk-sonda-dati.trigger | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          printf '%s' "$WANT" | grep -Eq '^[0-9a-f]{40}$' || { echo "ERRORE: serve sha= di 40 caratteri"; exit 1; }
          git fetch -q origin rule-pool
          git merge-base --is-ancestor "$WANT" origin/rule-pool || { echo "ERRORE: commit non in rule-pool"; exit 1; }
          echo "sha=$WANT" >> "$GITHUB_OUTPUT"
      - name: Prova sul VPS
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set +e
          mkdir -p ~/.ssh; echo "$SG_SSH_KEY" > ~/.ssh/id_sg; chmod 600 ~/.ssh/id_sg
          cat > ~/.ssh/known_hosts_sg <<'KH'
          51.79.205.82 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBDeMovQlEMs3Omccc1vMwPER3OkPLAtPltv11PjcbjSLDmutufUUwzqsRErqSo4XItzxdT3Z8nKCGZ/6zIFnQi4=
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          KH
          sg() { ssh -i ~/.ssh/id_sg -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_sg -o ConnectTimeout=30 root@51.79.205.82 "$@"; }
          : > out.txt
          {
            echo "=== PROVA DEL COMMIT $SHA ==="
            sg "set -e; D=/opt/superbot-probe-src; [ -d \$D/.git ] || git clone -q -b rule-pool https://github.com/alexiptv82/SuperBot-Trading.git \$D; cd \$D; git fetch -q origin rule-pool; git reset -q --hard $SHA; test \"\$(git rev-parse HEAD)\" = $SHA; echo codice pronto" 2>&1
            sg 'docker run -i --rm --name superbot-probe --read-only --tmpfs /tmp:size=32m --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus 0.5 --pids-limit 64 -v /opt/superbot-probe-src/backend:/app/backend:ro -e DESK_DATA_DIR=/tmp/probe -e DESK_MACRO_FETCH=0 superbot-desk python -' < deploy/scripts/sonda_dati.py 2>&1
            echo "=== BOT (non toccati) ==="
            sg 'docker ps --filter name=superbot-desk --format "{{.Names}} | {{.Status}} | {{.Image}}"'
            echo FINE
          } >> out.txt 2>&1
          rm -f ~/.ssh/id_sg
          cat out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          split -l 25 -d out.txt part_
          for f in part_*; do
            MSG=$(cut -c1-700 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | cut -c1-6500)
            echo "::notice title=Sonda dati ${f#part_}::${MSG}"
          done
          grep -q '^FINE' out.txt || exit 1
