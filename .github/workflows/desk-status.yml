name: Sala segnali - stato (sola lettura)

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-status.trigger"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leggi lo stato dal server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          timeout 60 ssh \
            -i ~/.ssh/id_desk \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            root@51.91.109.45 \
            'echo "=CONTAINERS="; docker ps -a --filter name=superbot --format "{{.Names}} {{.Status}}"; echo "=LOGS="; docker logs --tail 30 superbot-desk 2>&1; echo "=STATE="; cat /opt/superbot-desk-data/state_v2.json 2>/dev/null || echo "no state_v2.json"; echo "=TRADES="; tail -5 /opt/superbot-desk-data/trade_history.jsonl 2>/dev/null || echo "no trades"; echo "=LESSONS="; tail -5 /opt/superbot-desk-data/lessons.md 2>/dev/null || echo "no lessons"' \
            > status_out.txt 2>&1 || echo "SSH error: $?" >> status_out.txt
          rm -f ~/.ssh/id_desk

      - name: Output grezzo
        if: always()
        run: |
          echo "=== RISULTATO STATUS BOT V2 ==="
          cat status_out.txt 2>/dev/null || echo "(file vuoto)"

      - name: Annotation
        if: always()
        run: |
          CONTENT=$(cat status_out.txt 2>/dev/null | head -100 | tr '\n' '|' | cut -c1-5000)
          echo "::notice title=BotV2 Stato::${CONTENT}"
