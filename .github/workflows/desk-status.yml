name: Sala segnali - stato (sola lettura)

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-status.trigger"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Raccolta stato sul VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            OUT=/tmp/superbot_status.txt
            echo "=== CONTAINERS ===" > $OUT
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Status}} | {{.Image}}" >> $OUT
            echo "=== LOGS SUPERBOT-DESK (ultimi 30) ===" >> $OUT
            docker logs --tail 30 superbot-desk 2>&1 >> $OUT || echo "container non trovato" >> $OUT
            echo "=== STATE FILE ===" >> $OUT
            cat /opt/superbot-desk-data/state_v2.json 2>/dev/null | head -c 2000 >> $OUT || echo "no state_v2.json" >> $OUT
            echo "=== ULTIMI 5 TRADE ===" >> $OUT
            tail -5 /opt/superbot-desk-data/trade_history.jsonl 2>/dev/null >> $OUT || echo "no trade history" >> $OUT
            echo "=== LESSONS (last 10) ===" >> $OUT
            tail -10 /opt/superbot-desk-data/lessons.md 2>/dev/null >> $OUT || echo "no lessons" >> $OUT
            echo "File scritto: $(wc -l < $OUT) righe"

      - name: Leggi output dal VPS
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          ssh -T -i ~/.ssh/id_desk \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            root@51.91.109.45 \
            'cat /tmp/superbot_status.txt' 2>/dev/null > out.txt || true
          rm -f ~/.ssh/id_desk
          echo "=== OUTPUT BOT V2 ===" && cat out.txt
          OUT=$(cat out.txt | head -100 | tr '\n' '|' | sed 's/%/%25/g')
          echo "::notice title=BotV2 Stato::${OUT}"
