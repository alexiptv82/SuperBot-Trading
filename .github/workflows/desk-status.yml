name: Sala segnali - stato (sola lettura)

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-status.trigger"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leggi lo stato dal server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "=== CONTAINERS ==="
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Status}} | {{.Image}}"
            echo "=== LOGS SUPERBOT-DESK (ultimi 30) ==="
            docker logs --tail 30 superbot-desk 2>&1 || echo "container non trovato"
            echo "=== STATE FILE RAW ==="
            cat /opt/superbot-desk-data/state_v2.json 2>/dev/null | head -c 2000 || echo "no state_v2.json"
            echo "=== ULTIMI 5 TRADE ==="
            tail -5 /opt/superbot-desk-data/trade_history.jsonl 2>/dev/null || echo "no trade history"
            echo "=== ULTIMI 10 RIGHE LESSONS ==="
            tail -10 /opt/superbot-desk-data/lessons.md 2>/dev/null || echo "no lessons"
