name: Sala segnali - stato (sola lettura)

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-status.trigger"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Raccolta stato sul VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            OUT=/tmp/superbot_status.txt
            echo "=== CONTAINERS ===" > $OUT
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Status}} | {{.Image}}" >> $OUT
            echo "=== LOG HAWK (ultimi 20) ===" >> $OUT
            docker logs --tail 20 superbot-desk-hawk 2>&1 >> $OUT || echo "container hawk non trovato" >> $OUT
            echo "=== LOG BULL (ultimi 20) ===" >> $OUT
            docker logs --tail 20 superbot-desk-bull 2>&1 >> $OUT || echo "container bull non trovato" >> $OUT
            echo "=== STATE HAWK ===" >> $OUT
            cat /opt/superbot-desk-data/hawk/state_v2.json 2>/dev/null | head -c 1500 >> $OUT || echo "no hawk state" >> $OUT
            echo "=== STATE BULL ===" >> $OUT
            cat /opt/superbot-desk-data/bull/state_v2.json 2>/dev/null | head -c 1500 >> $OUT || echo "no bull state" >> $OUT
            echo "=== ULTIMI 3 TRADE HAWK ===" >> $OUT
            tail -3 /opt/superbot-desk-data/hawk/trade_history.jsonl 2>/dev/null >> $OUT || echo "no hawk trades" >> $OUT
            echo "=== ULTIMI 3 TRADE BULL ===" >> $OUT
            tail -3 /opt/superbot-desk-data/bull/trade_history.jsonl 2>/dev/null >> $OUT || echo "no bull trades" >> $OUT
            echo "File scritto: $(wc -l < $OUT) righe"

      - name: Leggi output dal VPS
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          ssh -T -i ~/.ssh/id_desk \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            root@51.91.109.45 \
            'cat /tmp/superbot_status.txt' 2>/dev/null > out.txt || true
          rm -f ~/.ssh/id_desk
          echo "=== OUTPUT BOT V2 ===" && cat out.txt
          OUT=$(cat out.txt | head -100 | tr '\n' '|' | sed 's/%/%25/g')
          echo "::notice title=BotV2 Stato::${OUT}"
