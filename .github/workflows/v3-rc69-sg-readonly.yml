name: RC69 Singapore PAPER preflight (READ ONLY, NO DEPLOY)
on:
  push:
    branches: [work/v3-rc69-singapore-preflight-20261107]
    paths: ['.github/workflows/v3-rc69-sg-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify audit script syntax (no VPS changes)
        run: bash -n deploy/scripts/v3-rc69-readonly-preflight.sh
      - name: Read-only Singapore inventory, no service or data changes
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SG_SSH_KEY:-}" || { echo "RC69_SSH_NOT_CONFIGURED"; exit 2; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          chmod 700 "$tmp"
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > "$tmp/key"
          chmod 600 "$tmp/key"
          cat > "$tmp/known_hosts" <<'HOSTKEY'
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          HOSTKEY
          chmod 600 "$tmp/known_hosts"
          ssh -T -i "$tmp/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            root@51.79.205.82 'bash -s' < deploy/scripts/v3-rc69-readonly-preflight.sh
