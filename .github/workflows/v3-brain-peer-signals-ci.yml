name: V3 Brain Falco Toro PAPER peer advisory (NO DEPLOY)
on:
  push:
    branches: [work/v3-brain-peer-signal-advisory-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brain-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy fastapi==0.110.0 httpx==0.27.0
      - name: Verify PAPER peer snapshots, Brain market analyst, risk and runner cycle
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_classic_peer_advisory.py \
            backend/tests/test_v3_brain_market_l5.py \
            backend/tests/test_v3_brain_market_l5_independent.py \
            backend/tests/test_v3_runner_cycle.py \
            backend/tests/test_v3_brain_accounting.py
      - name: No accidental syntax errors in Brain runtime
        run: |
          python -m py_compile backend/v3/brain_market/classic_peers.py \
            backend/v3/brain_market/deepseek_l5.py \
            backend/v3/runner/cycle.py backend/v3/runner/wiring.py
