name: V3 classic PAPER exit-only contract tests (NO DEPLOY)
on:
  push:
    branches: [work/v3-classic-paper-exit-only-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Test PAPER worker, API gates, snapshot, accounting and offline refusals
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          DESK_PORTFOLIO: hawk
          DESK_MACRO_FETCH: '0'
        run: |
          python -m pytest -q -p no:cacheprovider             backend/tests/test_v3_classic_exit_only.py             backend/tests/test_v3_classic_close_offline.py             backend/tests/test_desk_view.py
      - name: Compile changed backend modules
        run: python -m py_compile backend/desk/exit_only.py backend/desk_view.py backend/desk_api.py backend/v3_api.py backend/desk/cli.py
