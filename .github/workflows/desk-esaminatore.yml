name: Analista - esaminatore dei candidati scartati (sola lettura)

# Legge learning_log.jsonl di Hawk e Bull e le candele PUBBLICHE di Bitget dal server, e calcola come sarebbero andate
# le aperture che il bot ha deciso ma non eseguito (cooldown, confidenza bassa, blocco macro...). Non scrive nulla sul
# server, non tocca i bot, non usa chiavi di trading. Parte SOLO quando cambia deploy/desk-esaminatore.trigger.

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-esaminatore.trigger"

jobs:
  esaminatore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Esegui l'esaminatore sul server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_esam
          chmod 600 ~/.ssh/id_esam
          SSH="ssh -T -i $HOME/.ssh/id_esam -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=15 root@51.91.109.45"
          set +e
          echo "python sul server: $($SSH 'python3 --version 2>&1')" > esaminatore_out.txt
          cat backend/desk/analyst.py deploy/esaminatore_run.py > script_completo.py
          echo "script inviato: $(wc -l < script_completo.py) righe" >> esaminatore_out.txt
          $SSH 'python3 -I - hawk=/opt/superbot-desk-data/hawk bull=/opt/superbot-desk-data/bull' < script_completo.py > risultato.txt 2> errori.txt
          RC=$?
          echo "uscita=$RC, byte risultato=$(wc -c < risultato.txt), byte errori=$(wc -c < errori.txt)" >> esaminatore_out.txt
          cat risultato.txt >> esaminatore_out.txt
          if [ -s errori.txt ]; then echo "--- messaggi di errore ---" >> esaminatore_out.txt; head -n 40 errori.txt >> esaminatore_out.txt; fi
          if [ "$RC" != "0" ]; then echo "ESECUZIONE TERMINATA CON ERRORE" >> esaminatore_out.txt; fi
          set -e
          rm -f ~/.ssh/id_esam
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat esaminatore_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for N in 1 2 3 4 5 6; do
            A=$(( (N-1)*22 + 1 )); B=$(( N*22 ))
            PART=$(sed -n "${A},${B}p" esaminatore_out.txt | tr '\n' '|' | sed 's/%/%25/g')
            [ -n "$PART" ] && echo "::notice title=Esaminatore ${N}/6::${PART}"
          done
          cat esaminatore_out.txt
          if grep -q "ESECUZIONE TERMINATA CON ERRORE" esaminatore_out.txt; then exit 1; fi
