name: Work - public historical candles for weekend loss audit
on:
  push:
    branches: [work/backend-singapore-audit]
    paths: ['.github/workflows/work-weekend-market.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Read public market history only, without engine or order endpoints
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          SG_KNOWN_HOSTS: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: python deploy/weekend-audit/market_runner.py
