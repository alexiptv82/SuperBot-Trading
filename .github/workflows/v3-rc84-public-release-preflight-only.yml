name: SuperBot V3 - stage RC84 public release script PREFLIGHT ONLY
on:
  push:
    branches: [main]
    paths:
      - deploy/v3-rc84-public-release-preflight.trigger
permissions:
  contents: read
concurrency:
  group: superbot-v3-rc84-public-release-stage
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'alexiptv82/SuperBot-Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '3eb600e82e4c835653cde5032e58faee545ba73d'
      - name: Validate and stage RC84 release scripts, then preflight without a deploy
        shell: bash
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '3eb600e82e4c835653cde5032e58faee545ba73d'
          A=deploy/scripts/v3-rc84-public-paper-readonly-cutover.py
          B=deploy/scripts/v3-rc84-public-readonly-cutover-preflight.py
          test "$(git hash-object "$A")" = '42ec4b07a5c9fe4a87b64368e63aed166d3df611'
          test "$(git hash-object "$B")" = 'd0b025c8ef033a0b6174cf5ca846298c255979be'
          python3 - "$A" "$B" <<'PY'
          import ast, pathlib, sys
          for filename in sys.argv[1:]:
              source=pathlib.Path(filename).read_text()
              ast.parse(source,filename)
              print('RC84_RELEASE_PYTHON_AST_PASS='+filename.rsplit('/',1)[-1])
          PY
          test -n "${SG_SSH_KEY:-}"
          install -d -m 700 "$RUNNER_TEMP/sg"
          KEY="$RUNNER_TEMP/sg/id"
          HOSTS="$RUNNER_TEMP/sg/hosts"
          printf '%s\n' "$SG_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          printf '%s\n' '51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj' > "$HOSTS"
          chmod 600 "$HOSTS"
          trap 'rm -f "$KEY"' EXIT
          OPT=(-i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$HOSTS" -o ConnectTimeout=20)
          ssh "${OPT[@]}" root@51.79.205.82 'set -eu; d=/opt/superbot-v3-rc84-release-scripts; test ! -e "$d"; install -d -m 0700 "$d"'
          scp "${OPT[@]}" "$A" "$B" root@51.79.205.82:/opt/superbot-v3-rc84-release-scripts/
          ssh "${OPT[@]}" root@51.79.205.82 'set -eu; d=/opt/superbot-v3-rc84-release-scripts; chmod 0600 "$d"/*.py; PYTHONDONTWRITEBYTECODE=1 python3 -I "$d/v3-rc84-public-paper-readonly-cutover.py" --preflight-only'
          echo RC84_RELEASE_SCRIPTS_STAGED_NO_PUBLIC_DEPLOY=True
          echo RC84_RELEASE_NO_PAUSE_OR_KEY_CHANGES=True
