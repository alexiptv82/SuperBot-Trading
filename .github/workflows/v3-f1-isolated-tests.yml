name: 'SuperBot V3 F1 — unit tests isolati, nessun deploy'
on:
  push:
    branches: [work/v3-foundations-event-risk-20261102]
    paths:
      - 'backend/v3/**'
      - 'backend/tests/test_v3_*.py'
      - '.github/workflows/v3-f1-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolated Python syntax check
        run: python -m compileall -q backend/v3 backend/tests/test_v3_*.py
      - name: Install only test runner
        run: python -m pip install pytest
      - name: Verify V3 foundations
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_v3_*.py
