name: Brain Pilot PAPER - state-preserving upgrade (explicit approval)
on:
  push:
    branches: [rule-pool]
    paths: ["deploy/brain-pilot-upgrade.trigger"]
permissions:
  contents: read
concurrency:
  group: superbot-brain-pilot-singapore
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate explicit approval and immutable SHAs
        id: trigger
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          pairs = {}
          for line in Path('deploy/brain-pilot-upgrade.trigger').read_text().splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              key, value = line.split('=', 1)
              if key in pairs:
                  raise SystemExit('duplicate key')
              pairs[key] = value.strip()
          action = pairs.get('action')
          if action == 'none':
              raise SystemExit(0)
          sha = pairs.get('sha', '')
          previous = pairs.get('previous_sha', '')
          if (action != 'upgrade' or pairs.get('approved') != 'yes'
                  or not re.fullmatch('[0-9a-f]{40}', sha)
                  or not re.fullmatch('[0-9a-f]{40}', previous)):
              raise SystemExit('upgrade requires approved=yes and both full sha values')
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', previous, 'HEAD'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('upgrade=yes\nsha=' + sha + '\nprevious=' + previous + '\n')
          PY
      - name: Code upgrade on Singapore (backup, stop, reinstall, health gate)
        if: steps.trigger.outputs.upgrade == 'yes'
        uses: appleboy/ssh-action@v1.0.0
        env:
          BRAIN_SHA: ${{ steps.trigger.outputs.sha }}
          BRAIN_PREVIOUS: ${{ steps.trigger.outputs.previous }}
          BRAIN_CONTROL: ${{ github.sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:sNv9lNqWbZFf2Pm5ChIubeQKV5TzKfUWNlGPzCJg96s
          envs: BRAIN_SHA,BRAIN_PREVIOUS,BRAIN_CONTROL,DEEPSEEK_API_KEY
          command_timeout: 22m
          script: |
            set -eu
            umask 077
            test -n "$DEEPSEEK_API_KEY"
            test "${#BRAIN_SHA}" = 40
            test "${#BRAIN_PREVIOUS}" = 40
            CONTROL_DIR=$(mktemp -d /opt/superbot-brain-upgrader.XXXXXXXX)
            APP_DIR=$(mktemp -d /opt/superbot-brain-target.XXXXXXXX)
            trap 'rm -rf "$CONTROL_DIR" "$APP_DIR"' EXIT
            git init -q "$CONTROL_DIR"
            git -C "$CONTROL_DIR" remote add origin https://github.com/alexiptv82/SuperBot-Trading.git
            git -C "$CONTROL_DIR" fetch -q --depth=1 origin "$BRAIN_PREVIOUS" "$BRAIN_SHA" "$BRAIN_CONTROL"
            git -C "$CONTROL_DIR" checkout -q --detach "$BRAIN_CONTROL"
            test "$(git -C "$CONTROL_DIR" rev-parse HEAD)" = "$BRAIN_CONTROL"
            git -C "$CONTROL_DIR" worktree add -q --detach "$APP_DIR" "$BRAIN_SHA"
            test "$(git -C "$APP_DIR" rev-parse HEAD)" = "$BRAIN_SHA"
            export BRAIN_INSTALL_APPROVED=yes
            python3 "$CONTROL_DIR/deploy/scripts/brain_pilot_upgrade.py" \
              --sha "$BRAIN_SHA" --previous "$BRAIN_PREVIOUS" --repo "$APP_DIR"

