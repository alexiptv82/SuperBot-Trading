name: VPS resources diagnostic (read-only, manual trigger)

# Only a deliberate change to deploy/vps-diagnostics.trigger on rule-pool starts this.
# Publishing/editing this workflow file does NOT start it.
on:
  push:
    branches: [rule-pool]
    paths:
      - 'deploy/vps-diagnostics.trigger'

permissions:
  contents: read

concurrency:
  group: vps-diagnostics-readonly
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only VPS resource indicators
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          command_timeout: 45s
          script: |
            echo '=== HOST ==='
            hostname
            uptime
            echo '=== MEMORY ==='
            free -h
            echo '=== DISK ==='
            df -h -x tmpfs -x devtmpfs
            echo '=== TOP MEMORY PROCESSES ==='
            ps -eo pid,comm,rss --sort=-rss | head -n 16
            echo '=== CONTAINERS (name and status only) ==='
            docker ps --format '{{.Names}} | {{.Status}}'
            echo '=== CONTAINER RESOURCE SNAPSHOT ==='
            timeout 12s docker stats --no-stream --format '{{.Name}} | mem={{.MemUsage}} | cpu={{.CPUPerc}}' || true
            echo '=== OOM EVENTS IN LAST 48 HOURS (max 25) ==='
            journalctl -k --since '48 hours ago' --no-pager -o short-iso 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 25 || true
