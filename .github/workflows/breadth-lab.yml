name: Laboratorio ampiezza (solo ricerca, sola lettura)

# Scarica candele 1h PUBBLICHE delle coppie piu' liquide dei perpetual USDT di
# BitGet (nessuna chiave) e misura il trend following con regole fissate in
# anticipo. Non fa deploy, non usa segreti, non tocca il bot in funzione.
#
# Parte da sola ad ogni push sul ramo `risk-profiles` che tocca questi file.

on:
  push:
    branches: [risk-profiles]
    paths:
      - ".github/workflows/breadth-lab.yml"
      - "backend/breadth_lab.py"
      - "backend/tests/test_breadth_lab.py"

permissions:
  contents: read

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pytest

      - name: Unit tests
        run: python -m pytest tests/test_breadth_lab.py tests/test_strategy_lab.py -q

      # Cache salvata anche se il job fallisce a meta': un nuovo tentativo
      # riparte dalle coppie gia' scaricate e dallo stesso universo.
      - name: Ripristina cache
        uses: actions/cache/restore@v4
        with:
          path: backend/breadth_cache
          key: lab-breadth-v1-${{ github.run_id }}
          restore-keys: lab-breadth-v1-

      - name: Laboratorio ampiezza
        shell: bash
        run: |
          set -o pipefail
          python -u breadth_lab.py --cache-dir breadth_cache --out breadth_lab_results.json \
            --annotate 2>&1 | tee breadth_lab_output.log

      - name: Salva cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/breadth_cache
          key: lab-breadth-v1-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breadth-lab-${{ github.run_id }}
          path: |
            backend/breadth_lab_output.log
            backend/breadth_lab_results.json
          if-no-files-found: ignore
          retention-days: 30
