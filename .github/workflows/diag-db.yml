name: Diagnosi database (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Diagnosi (nessun segreto viene stampato)
        run: |
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }
          cd /opt/superbot
          note "git: file dati tracciati" "$(git ls-files data) | stato: $(git status --short data | head -3) | ultimo commit: $(git log -1 --format='%h %cd' --date=iso)"
          note "snapshot nel repository" "$(git log --format='%h %ad' --date=short -3 -- data/superbot.db | tr '\n' ';')"
          note "file db live" "$(stat -c '%y %s byte' data/superbot.db)"
          RES=$(python3 - <<'PY'
          import sqlite3, subprocess
          def counts(path):
              con = sqlite3.connect('file:%s?mode=ro' % path, uri=True)
              out = {}
              for t in ('trades', 'audit_log', 'market_snapshots', 'risk_settings', 'auth_settings', 'webauthn_credentials'):
                  try:
                      out[t] = con.execute('select count(*) from %s' % t).fetchone()[0]
                  except Exception as e:
                      out[t] = 'n/d'
              try:
                  out['ultima_riga_audit'] = str(con.execute('select max(timestamp) from audit_log').fetchone()[0])[:19]
                  out['ultimo_trade'] = str(con.execute('select max(opened_at) from trades').fetchone()[0])[:19]
              except Exception as e:
                  pass
              return out
          print('LIVE:', counts('/opt/superbot/data/superbot.db'))
          snap = open('/tmp/snap.db', 'wb')
          subprocess.run(['git', '-C', '/opt/superbot', 'show', 'HEAD:data/superbot.db'], stdout=snap)
          snap.close()
          print('SNAPSHOT NEL REPO:', counts('/tmp/snap.db'))
          PY
          )
          note "Contenuto: db live vs copia nel repository" "$RES"
          REMOTE
