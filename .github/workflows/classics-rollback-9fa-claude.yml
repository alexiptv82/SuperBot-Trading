name: Classici - ritorno al 13/10 (9fa667f) - SOLO verifica, nessun deploy
on:
  push:
    branches: [work/ritorno-9fa667f-claude-20261029]
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy pandas "ccxt==4.2.95" tzdata pyyaml
      - name: Perimetro - cambia solo cio' che e' dichiarato
        run: |
          set -e
          BASE=c1a7c91924c92ff7a2a48988dfa0c3bda96aad48
          CHANGED="$(git diff --name-only $BASE HEAD)"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | grep -vE '^(backend/desk/(brain|cli|engine|learning|notifier|signals)\.py|backend/tests_rollback_9fa/.*|\.github/workflows/desk-deploy\.yml|\.github/workflows/classics-rollback-9fa-claude\.yml|deploy/ritorno-9fa667f/.*)$' || true)"
          test -z "$BAD" || { echo "FUORI PERIMETRO: $BAD"; exit 1; }
          for f in brain cli learning notifier signals; do
            git diff --quiet 9fa667f HEAD -- backend/desk/$f.py || { echo "backend/desk/$f.py diverso da 9fa667f"; exit 1; }
            echo "backend/desk/$f.py identico a 9fa667f"
          done
          git diff 9fa667f HEAD -- backend/desk/engine.py | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' > /tmp/engine.diff
          cat /tmp/engine.diff
          test "$(grep -c '^-' /tmp/engine.diff)" = 3 || { echo "engine.py: troppe righe tolte rispetto a 9fa667f"; exit 1; }
          echo "engine.py = 9fa667f + solo l'adattatore di lettura dichiarato"
      - name: Suite del 13/10 e compatibilita' dello stato attuale
        run: |
          set -e
          mkdir -p /tmp/cur
          git archive c1a7c91924c92ff7a2a48988dfa0c3bda96aad48 backend/desk backend/rule_pool backend/strategy_lab.py | tar -x -C /tmp/cur
          cd backend
          CURRENT_BACKEND_DIR=/tmp/cur/backend python -m pytest tests_rollback_9fa -q -p no:cacheprovider -rs 2>&1 | tail -40
          test "${PIPESTATUS[0]}" = 0
      - name: Guardie del deploy dei bot e YAML
        run: |
          set -e
          python -c "import yaml; yaml.safe_load(open('.github/workflows/desk-deploy.yml')); print('desk-deploy.yml: YAML valido')"
          cd deploy/scripts
          python -m unittest test_fix_a_deploy_guards test_deploy_workflow 2>&1 | tail -6
      - name: L'immagine dei bot si costruisce e importa il codice del 13/10
        run: |
          set -e
          docker build -q -f Dockerfile.desk -t desk-rollback-test .
          docker run --rm --entrypoint python desk-rollback-test -c "import desk.cli, desk.engine, desk.healthcheck; print('IMPORT OK')"
          docker run --rm --entrypoint python desk-rollback-test -c "from desk import capital_journal, capital_manager, capital_runtime, vault_manager, position_sizer; print('moduli capitale importabili')" || echo "moduli capitale NON importabili con il codice del 13/10 (atteso: il profilo legacy_13oct salta quel controllo)"
      - name: Impronte dei file runtime (per il confronto con il deploy)
        run: sha256sum backend/desk/cli.py backend/desk/engine.py backend/desk/signals.py backend/desk/brain.py backend/desk/learning.py backend/desk/notifier.py
