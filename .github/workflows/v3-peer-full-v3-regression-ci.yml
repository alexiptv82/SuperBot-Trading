name: V3 entire PAPER regression after peer advisory (NO DEPLOY)
on:
  push:
    branches: [work/v3-brain-peer-signal-advisory-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v3-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Test all V3 PAPER modules, journals, mandates, manual exits, runner and dashboard
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          DESK_MACRO_FETCH: '0'
        run: python -m pytest -q -p no:cacheprovider backend/tests/test_v3_*.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Three portfolio UI regression
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=Overview
      - name: Build PAPER dashboard
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
