name: SuperBot - setup SSL per sbtrading.hitvprime.com

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/setup-ssl-sbtrading.trigger"

jobs:
  setup-ssl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ottieni certificato SSL e configura nginx
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 "echo '' | base64 -d | bash"
          rm -f ~/.ssh/id_tmp
