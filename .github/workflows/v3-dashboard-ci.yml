name: v3-dashboard-ci
# Solo prove (nessun deploy, nessun segreto): dashboard unificata V3 in sola lettura.
on:
  push:
    branches:
      - work/v3-dashboard-unificata-chatgpt-20261105
      - work/v3-dashboard-chiudi-chatgpt-20261105
      - work/v3-release-candidate-gpt6-20261106
      - work/v3-classic-close-offline-safety-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0
      - name: API della dashboard (sessione, sola lettura, file mancanti, decimali come stringhe)
        env:
          PYTHONPATH: .:backend
        run: python -m pytest -q -p no:cacheprovider backend/tests/test_v3_dashboard_unified.py
      - name: Chiusura manuale (richiesta, esito, errori, prova con il runner vero del Brain)
        env:
          PYTHONPATH: .:backend
        run: |
          set -o pipefail
          python -m pytest -q -rs -p no:cacheprovider backend/tests/test_v3_dashboard_manual_close.py | tee close-tests.log
          # La prova con il runner vero non deve essere saltata: uno skip qui conta come errore.
          if grep -qi "skipped" close-tests.log; then echo "ERRORE: test saltati"; exit 1; fi
      - name: 'Classic close fail-closed: stopped bots cannot receive delayed flags'
        env:
          PYTHONPATH: .:backend
        run: python -m pytest -q -p no:cacheprovider backend/tests/test_v3_classic_close_offline.py backend/tests/test_desk_view.py
      - name: Sintassi di server.py e dell'API (senza importare il runtime del bot)
        run: python -m py_compile backend/v3_api.py backend/server.py
  v3-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0
      - name: Suite V3 completa (Brain, runner, dashboard) - nessuna regressione
        env:
          PYTHONPATH: .:backend
        run: python -m pytest -q -p no:cacheprovider backend/tests/test_v3_*.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Pagina Overview e pulsanti Chiudi (rendering, conferma, esiti, errori)
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=Overview
      - name: Build di produzione
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build

  classics-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Verify classic engines, optional S25 and PAPER close request
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          DESK_MACRO_FETCH: '0'
        run: |
          python -m py_compile backend/desk/cli.py backend/desk/long_s25.py backend/desk/trend_change.py backend/desk/signals.py backend/desk/brain.py
          python -m pytest -q -p no:cacheprovider backend/tests/test_desk.py backend/tests/test_long_s25.py backend/tests/test_desk_trend_change_advisory.py
