name: v3-dashboard-ci
# Solo prove (nessun deploy, nessun segreto): dashboard unificata V3 in sola lettura.
on:
  push:
    branches: [work/v3-dashboard-unificata-chatgpt-20261105]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0
      - name: API della dashboard (sessione, sola lettura, file mancanti, decimali come stringhe)
        env:
          PYTHONPATH: .:backend
        run: python -m pytest -q -p no:cacheprovider backend/tests/test_v3_dashboard_unified.py
      - name: Sintassi di server.py e dell'API (senza importare il runtime del bot)
        run: python -m py_compile backend/v3_api.py backend/server.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Pagina Overview (rendering, non avviato, errore)
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=Overview.test.js
      - name: Build di produzione
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
