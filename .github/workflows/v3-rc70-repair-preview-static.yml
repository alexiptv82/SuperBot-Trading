name: RC70 repair isolated loopback-only preview assets (NO PRODUCTION CHANGES)
on:
  push:
    branches: [work/v3-rc70-authorized-dashboard-cutover-20261107]
    paths: ['.github/workflows/v3-rc70-repair-preview-static.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superbot-rc70-singapore-preview
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/scripts/v3-rc70-repair-static-preview.sh
      - name: Repair static paths only in isolated Singapore staging Nginx
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SG_SSH_KEY:-}" || exit 2
          t="$(mktemp -d)"
          trap 'rm -rf "$t"' EXIT
          chmod 700 "$t"
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > "$t/key"
          chmod 600 "$t/key"
          cat > "$t/known_hosts" <<'KEY'
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          KEY
          chmod 600 "$t/known_hosts"
          ssh -T -i "$t/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$t/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            root@51.79.205.82 'bash -s' < deploy/scripts/v3-rc70-repair-static-preview.sh
