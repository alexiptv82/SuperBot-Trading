name: SuperBot V3 F2 — isolated mock and F1 regression tests
on:
  push:
    branches: [work/v3-brain-f2-grok]
    paths:
      - 'backend/v3/**'
      - 'backend/tests/test_brain_f2.py'
      - '.github/workflows/v3-f2-grok-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-f1-f2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Compile F1 and F2 Python
        run: python -m compileall -q backend/v3 backend/tests/test_brain_f2.py backend/tests/test_v3_*.py
      - name: Run isolated F1 and F2 suites (no network clients or credentials)
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_v3_*.py backend/tests/test_brain_f2.py
