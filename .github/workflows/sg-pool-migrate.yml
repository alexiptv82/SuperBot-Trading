name: Pool di regole - migrazione Strasburgo -> Singapore

# Ferma "superbot-pool" a Strasburgo (SENZA rimuoverlo: si riavvia con
# docker start), copia i suoi dati (pool.db + candele) su Singapore e avvia
# li' lo stesso container. Il runner in avanti scarica da solo le candele
# pubbliche mancanti, quindi non perde storico. Nessuna chiave exchange.
# Non tocca Hawk/Bull, ne' l'app, ne' HI-TV.

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/sg-pool-migrate.trigger"

jobs:
  migrate-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifica memoria e disco su Singapore, poi ferma il pool a Strasburgo e copia i dati
        env:
          STR_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SG_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh /tmp/pool
          echo "$STR_KEY" > ~/.ssh/id_str; chmod 600 ~/.ssh/id_str
          echo "$SG_KEY"  > ~/.ssh/id_sg;  chmod 600 ~/.ssh/id_sg
          OPT="-o StrictHostKeyChecking=no -o ConnectTimeout=30"
          S="ssh -i $HOME/.ssh/id_str $OPT root@51.91.109.45"
          G="ssh -i $HOME/.ssh/id_sg $OPT root@51.79.205.82"
          OUT=deploy/sg-pool-migrate-output.txt
          run_all() {
          set -e
          echo "### Migrazione pool $(date -u +%FT%TZ)"
          AVAIL=$($G "awk '/MemAvailable/ {print int(\$2/1024)}' /proc/meminfo")
          DISK=$($G "df -BG --output=avail /opt | tail -1 | tr -dc '0-9'")
          echo "Singapore: memoria disponibile ${AVAIL} MB, disco libero ${DISK} GB"
          [ "$AVAIL" -ge 900 ] && [ "$DISK" -ge 3 ] || { echo "ERRORE: risorse insufficienti su Singapore, il pool NON viene toccato"; exit 1; }
          if $G "docker ps -a --format '{{.Names}}' | grep -qx superbot-pool"; then
            echo "ATTENZIONE: superbot-pool esiste gia' su Singapore; non lo sovrascrivo"; exit 1
          fi
          echo; echo "== Strasburgo: stop ordinato del pool (reversibile) =="
          $S "docker update --restart=no superbot-pool >/dev/null && docker stop -t 40 superbot-pool && echo 'superbot-pool fermato (non rimosso)'"
          $S "ls -la --time-style=long-iso /opt/superbot-pool-data /opt/superbot-pool-data/candles | head -20; find /opt/superbot-pool-data -type f | wc -l | sed 's/^/file totali: /'"
          $S "tar -C /opt/superbot-pool-data -cf - ." > /tmp/pool/pool-data.tar
          [ "$(stat -c %s /tmp/pool/pool-data.tar)" -gt 10000 ] || { echo "ERRORE: archivio dati troppo piccolo; riavvio il pool a Strasburgo"; $S "docker update --restart=unless-stopped superbot-pool; docker start superbot-pool"; exit 1; }
          tar -tf /tmp/pool/pool-data.tar >/dev/null
          echo "archivio dati: $(stat -c %s /tmp/pool/pool-data.tar) byte, leggibile"
          echo; echo "== Singapore: ripristino dati =="
          $G "mkdir -p /opt/superbot-pool-data"
          cat /tmp/pool/pool-data.tar | $G "tar -C /opt/superbot-pool-data -xf -"
          echo "Singapore ha $($G "find /opt/superbot-pool-data -type f | wc -l") file; Strasburgo ne aveva $($S "find /opt/superbot-pool-data -type f | wc -l")"
          H1=$($S "sha256sum /opt/superbot-pool-data/pool.db | cut -c1-16")
          H2=$($G "sha256sum /opt/superbot-pool-data/pool.db | cut -c1-16")
          echo "pool.db sha256 Strasburgo=$H1 Singapore=$H2"
          [ "$H1" = "$H2" ] || { echo "ERRORE: pool.db non identico"; exit 1; }
          }
          set +e
          ( run_all ) > $OUT 2>&1
          RC=$?
          [ $RC -ne 0 ] && echo "!!! ERRORE (codice $RC): il pool NON e' stato avviato su Singapore. Se e' fermo a Strasburgo: docker start superbot-pool" >> $OUT
          rm -rf /tmp/pool ~/.ssh/id_str ~/.ssh/id_sg
          cat $OUT
          exit $RC

      - name: Avvia il pool su Singapore
        uses: appleboy/ssh-action@v1.0.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            apt-get install -y docker.io git 2>/dev/null || true
            systemctl start docker 2>/dev/null || true
            if [ -d "/opt/superbot-pool/.git" ]; then
              cd /opt/superbot-pool && git fetch origin rule-pool && git reset --hard origin/rule-pool
            else
              mkdir -p /opt/superbot-pool && cd /opt/superbot-pool
              git init -q && git remote add origin https://github.com/alexiptv82/SuperBot-Trading.git
              git fetch origin rule-pool && git reset --hard origin/rule-pool
            fi
            docker build -t superbot-pool -f Dockerfile.pool .
            docker run -d \
              --name superbot-pool \
              --restart unless-stopped \
              --memory 768m --cpus 0.5 \
              -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID \
              -v /opt/superbot-pool-data:/app/data/pool \
              -v /opt/superbot/data:/app/botdata:ro \
              superbot-pool
            sleep 5

      - name: Verifica (sola lettura) e committa esito
        env:
          SG_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "$SG_KEY" > ~/.ssh/id_sg; chmod 600 ~/.ssh/id_sg
          sleep 75
          OUT=deploy/sg-pool-migrate-output.txt
          {
            echo; echo "== Verifica pool su Singapore (dopo avvio) =="
            ssh -i ~/.ssh/id_sg -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@51.79.205.82 'bash -s' <<'REMOTE'
          docker ps -a --filter name=^superbot-pool$ --format "{{.Names}} | {{.Status}}"
          echo "salute docker: $(docker inspect -f '{{.State.Health.Status}}' superbot-pool 2>&1 | head -1)"
          docker exec superbot-pool python -m rule_pool.cli health --data-dir /app/data/pool 2>&1 | tr '\n' ' ' | cut -c1-400; echo
          echo "--- log (ultimi 10) ---"
          docker logs --tail 10 superbot-pool 2>&1 | cut -c1-240
          docker stats --no-stream --format "uso: cpu={{.CPUPerc}} mem={{.MemUsage}}" superbot-pool
          REMOTE
          } >> $OUT 2>&1 || true
          rm -f ~/.ssh/id_sg
          cat $OUT
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add $OUT
          git diff --staged --quiet || git commit -m "pool: esito migrazione [skip ci]"
          git push origin rule-pool
