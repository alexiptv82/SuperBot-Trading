name: Sonda storico funding (solo lettura)

# Interroga solo endpoint PUBBLICI per capire dove esiste uno storico lungo del
# funding. Nessuna chiave, nessun deploy, nessun contatto col bot in funzione.

on:
  push:
    branches: [risk-profiles]
    paths:
      - ".github/workflows/funding-probe.yml"
      - "backend/funding_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt
      - name: Sonda
        run: python -u funding_probe.py
