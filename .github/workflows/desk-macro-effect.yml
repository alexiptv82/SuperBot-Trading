name: Sala segnali - effetto del filtro macro (sola lettura)

# Legge soltanto: quanti candidati ha bloccato il filtro macro dopo l'ultimo azzeramento, quali eventi ci sono nel
# calendario e quanta parte della settimana e' sotto blocco / regime alto con i parametri attuali e con alternative.
# NON scrive nei dati dei bot, NON ferma e NON riavvia nulla. Nessun segreto in uscita.
# Parte SOLO quando cambia deploy/desk-macro-effect.trigger.

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-macro-effect.trigger"

jobs:
  effect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Analisi
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            OUT=/tmp/superbot_macro_effect.txt
            : > $OUT
            for P in hawk bull; do
              python3 -I - /opt/superbot-desk-data/$P $P >> $OUT 2>&1 <<'PYEOF' || echo "($P: analisi non riuscita)" >> $OUT
            import collections, json, os, sys, time
            d, name = sys.argv[1], sys.argv[2]
            CH = 7200   # ora svizzera = UTC+2 fino al 25 ottobre
            def hm(ms):
                return time.strftime("%d %H:%M", time.gmtime(ms / 1000 + CH))
            st = json.load(open(os.path.join(d, "state_v2.json")))
            t0 = int(st.get("run_started_ms") or 0)
            now = time.time() * 1000
            print("=== %s: run %s partita %s (ora svizzera), %.1f ore fa ===" % (name.upper(), st.get("run_no"), hm(t0), (now - t0) / 3.6e6))
            rows = []
            for line in open(os.path.join(d, "learning_log.jsonl"), encoding="utf-8"):
                try:
                    r = json.loads(line)
                except ValueError:
                    continue
                if r.get("ts", 0) >= t0 and r.get("ev") in ("candidate", "open", "close", "claude_call"):
                    rows.append(r)
            print("eventi nella run:", dict(collections.Counter(r["ev"] for r in rows)))
            cand = [r for r in rows if r["ev"] == "candidate"]
            print("candidati per stato:", dict(collections.Counter(r.get("status") for r in cand)))
            bh = collections.defaultdict(collections.Counter)
            for r in cand:
                bh[time.strftime("%H", time.gmtime(r["ts"] / 1000 + CH))][r.get("status")] += 1
            for h in sorted(bh):
                print("  ore %s: %s" % (h, dict(bh[h])))
            def base_thr(r):
                return 60 if (r.get("features") or {}).get("tier") in ("A", "B") else 70
            mb = [r for r in cand if r.get("status") == "macro_blocco"]
            passa = [r for r in mb if ((r.get("features") or {}).get("conf") or 0) >= base_thr(r)]
            passa5 = [r for r in mb if ((r.get("features") or {}).get("conf") or 0) >= base_thr(r) + 5]
            print("bloccati dalla macro: %d candidati; con confidenza >= soglia normale: %d; >= soglia+5: %d" % (len(mb), len(passa), len(passa5)))
            seen = set()
            for r in passa:
                k = (r["symbol"], r.get("side"))
                if k in seen:
                    continue
                seen.add(k)
                f = r.get("features") or {}
                print("  avrebbe aperto? %s %s conf=%s (soglia %d) tipo=%s alle %s" % (
                    r["symbol"], "LONG" if r.get("side") == 1 else "SHORT", f.get("conf"), base_thr(r), f.get("dec_type"), hm(r["ts"])))
                if len(seen) >= 14:
                    break
            cb = [r for r in cand if r.get("status") == "conf_bassa_macro"]
            print("fermati solo dal +5 (regime alto): %d candidati" % len(cb))
            for r in [r for r in rows if r["ev"] == "open"][:12]:
                f = r.get("features") or {}
                print("  APERTA %s %s conf=%s alle %s" % (r.get("symbol"), "LONG" if r.get("side") == 1 else "SHORT", f.get("conf"), hm(r["ts"])))
            print("chiamate a Claude nella run:", sum(1 for r in rows if r["ev"] == "claude_call"))
            byday = collections.defaultdict(lambda: [0, 0, 0, 0])
            for line in open(os.path.join(d, "learning_log.jsonl"), encoding="utf-8"):
                try:
                    r = json.loads(line)
                except ValueError:
                    continue
                if r.get("ev") not in ("candidate", "open"):
                    continue
                t = time.gmtime(r["ts"] / 1000 + CH)
                k = "%02d/%02d" % (t.tm_mday, t.tm_mon)
                i = 0 if 4 <= t.tm_hour < 9 else 2
                byday[k][i + (0 if r["ev"] == "candidate" else 1)] += 1
            print("stessa fascia 04-09 ora CH nei giorni (candidati, aperture) | resto del giorno (candidati, aperture):")
            for k in sorted(byday):
                v = byday[k]
                print("  %s: 04-09 -> %d cand, %d aperte | resto -> %d cand, %d aperte" % (k, v[0], v[1], v[2], v[3]))
            PYEOF
            done
            echo "=== CALENDARIO E SIMULAZIONE (dentro il container hawk, solo lettura) ===" >> $OUT
            docker exec -i superbot-desk-hawk python - >> $OUT 2>&1 <<'PYEOF' || echo "(simulazione non riuscita)" >> $OUT
            import dataclasses, json, os, time
            from desk import macro_calendar as mc
            cache = json.load(open(os.path.join(os.environ["DESK_DATA_DIR"], "macro_events.json")))
            ev = sorted(cache["ff"]["events"] + cache["bls"]["events"], key=lambda e: e["ts"])
            now = int(time.time() * 1000)
            CH = 7200 * 1000
            DAYS = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"]
            def fmt(ts):
                t = time.gmtime((ts + CH) / 1000)
                return "%s %02d/%02d %02d:%02d" % (DAYS[t.tm_wday], t.tm_mday, t.tm_mon, t.tm_hour, t.tm_min)
            win = [e for e in ev if now - 12 * 3600e3 <= e["ts"] <= now + 8 * 24 * 3600e3]
            hi = [e for e in win if e["impact"] == "High"]
            print("eventi USA nella finestra (da 12h fa a 8 giorni): %d alti, %d medi" % (len(hi), len(win) - len(hi)))
            for e in win:
                print("  %s ora CH | %-6s | %s (%s)" % (fmt(e["ts"]), e["impact"], e["title"], e["src"]))
            base = mc.CFG
            scen = [
                ("ATTUALE  blocco 60/120, regime -3/+12h, bonus +5", base),
                ("bonus +3 (resto uguale)", dataclasses.replace(base, conf_bonus_alto=3)),
                ("bonus +2 (resto uguale)", dataclasses.replace(base, conf_bonus_alto=2)),
                ("blocco 30/60, regime -2/+6h, bonus +3", dataclasses.replace(base, block_before_min=30, block_after_min=60, lookback_h=2, lookahead_h=6, conf_bonus_alto=3)),
                ("blocco 15/45, regime -1/+3h, bonus +3", dataclasses.replace(base, block_before_min=15, block_after_min=45, lookback_h=1, lookahead_h=3, conf_bonus_alto=3)),
            ]
            step = 10 * 60 * 1000
            n_steps = int(7 * 24 * 3600e3 // step)
            print("quota della prossima SETTIMANA sotto blocco / regime alto (passi di 10 minuti):")
            for label, cfg in scen:
                b = a = 0
                for i in range(n_steps):
                    m = mc.evaluate(ev, now + i * step, cfg)
                    b += bool(m["blackout"])
                    a += m["regime"] == "alto"
                print("  %-52s blocco %4.1f%% (%5.1f ore) | regime alto %4.1f%% (%5.1f ore)" % (label, 100 * b / n_steps, b * step / 3.6e6, 100 * a / n_steps, a * step / 3.6e6))
            PYEOF
            echo "=== RIPASSO DELLA SETTIMANA APPENA FINITA (tutti gli eventi del feed in cache) ===" >> $OUT
            docker exec -i superbot-desk-hawk python - >> $OUT 2>&1 <<'PYEOF' || echo "(ripasso non riuscito)" >> $OUT
            import dataclasses, json, os, time
            from desk import macro_calendar as mc
            cache = json.load(open(os.path.join(os.environ["DESK_DATA_DIR"], "macro_events.json")))
            ev = sorted(cache["ff"]["events"] + cache["bls"]["events"], key=lambda e: e["ts"])
            CH = 7200 * 1000
            DAYS = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"]
            def fmt(ts):
                t = time.gmtime((ts + CH) / 1000)
                return "%s %02d/%02d %02d:%02d" % (DAYS[t.tm_wday], t.tm_mday, t.tm_mon, t.tm_hour, t.tm_min)
            week = [e for e in ev if e["src"] == "ff"]
            print("feed settimanale in cache: %d eventi USA (alti %d, medi %d)" % (len(week), sum(e["impact"] == "High" for e in week), sum(e["impact"] == "Medium" for e in week)))
            for e in week:
                print("  %s ora CH | %-6s | %s" % (fmt(e["ts"]), e["impact"], e["title"]))
            T1 = ("cpi", "non-farm", "nonfarm", "fomc", "federal funds", "pce", "employment change", "unemployment rate")
            def tier1(e):
                t = e["title"].lower()
                return e["src"] == "bls" or any(k in t for k in T1)
            t1 = [e for e in ev if e["impact"] == "High" and tier1(e)]
            print("di cui 'grandi' (CPI, occupazione, FOMC, PCE): %d" % len([e for e in week if e["impact"] == "High" and tier1(e)]))
            # replay: lunedi 00:00 UTC -> venerdi 23:59 UTC della settimana del feed
            first = min(e["ts"] for e in week) if week else 0
            day0 = first - first % 86400000
            while time.gmtime(day0 / 1000).tm_wday != 0:
                day0 -= 86400000
            step = 10 * 60 * 1000
            n = int(5 * 86400000 // step)
            base = mc.CFG
            big_only = [e for e in ev if e["impact"] != "High" or tier1(e)]
            scen = [
                ("ATTUALE 60/120, -3/+12h, +5, tutti gli alti", base, ev),
                ("+3 (resto uguale), tutti gli alti", dataclasses.replace(base, conf_bonus_alto=3), ev),
                ("solo i GRANDI, 60/120, -3/+12h, +5", base, big_only),
                ("grandi come ora; discorsi/altri: 15/30, +2", None, ev),
                ("PROPOSTA grandi 60/120 -3/+6h +3; altri 15/30 no bonus", "prop", ev),
            ]
            print("settimana lun-ven (120 ore di mercato), quota sotto blocco / regime alto:")
            for label, cfg, evs in scen:
                b = a = 0
                for i in range(n):
                    now = day0 + i * step
                    if cfg == "prop":
                        big = mc.evaluate([e for e in ev if e["impact"] != "High" or tier1(e)], now, dataclasses.replace(base, lookahead_h=6, conf_bonus_alto=3))
                        small = mc.evaluate([e for e in ev if e["impact"] == "High" and not tier1(e)], now, dataclasses.replace(base, block_before_min=15, block_after_min=30, lookback_h=0, lookahead_h=0, conf_bonus_alto=0))
                        b += bool(big["blackout"] or small["blackout"])
                        a += (big["regime"] == "alto")
                    elif cfg is None:
                        big = mc.evaluate([e for e in ev if e["impact"] != "High" or tier1(e)], now, base)
                        small = mc.evaluate([e for e in ev if e["impact"] == "High" and not tier1(e)], now, dataclasses.replace(base, block_before_min=15, block_after_min=30, lookback_h=1, lookahead_h=3, conf_bonus_alto=2))
                        b += bool(big["blackout"] or small["blackout"])
                        a += (big["regime"] == "alto" or small["regime"] == "alto")
                    else:
                        m = mc.evaluate(evs, now, cfg)
                        b += bool(m["blackout"])
                        a += m["regime"] == "alto"
                print("  %-46s blocco %5.1f ore | regime alto %5.1f ore" % (label, b * step / 3.6e6, a * step / 3.6e6))
            PYEOF
            echo "DONE"

      - name: Pubblica output
        env:
          SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          ssh -T -i ~/.ssh/id_desk -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            root@51.79.205.82 'cat /tmp/superbot_macro_effect.txt' 2>/dev/null > out.txt || true
          rm -f ~/.ssh/id_desk
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          split -l 20 -d out.txt part_
          for f in part_*; do
            OUT=$(cut -c1-230 "$f" | tr '\n' '|' | sed 's/%/%25/g')
            echo "::notice title=Effetto macro ${f#part_}::${OUT}"
          done
          cat out.txt
