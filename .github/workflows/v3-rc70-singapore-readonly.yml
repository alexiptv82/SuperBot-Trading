name: RC70 Singapore app and exit-only pre-deploy inspection (READ ONLY)
on:
  push:
    branches: [work/v3-rc70-authorized-dashboard-cutover-20261107]
    paths: ['.github/workflows/v3-rc70-singapore-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify local scanner
        run: python3 -m py_compile deploy/scripts/v3-rc70-stage-inventory-readonly.py
      - name: Inspect Singapore read-only, no deployment
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SG_SSH_KEY:-}" || { echo RC70_NO_SSH_KEY; exit 2; }
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          chmod 700 "$temp"
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > "$temp/key"
          chmod 600 "$temp/key"
          cat > "$temp/known_hosts" <<'KEY'
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          KEY
          chmod 600 "$temp/known_hosts"
          ssh -T -i "$temp/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            root@51.79.205.82 'python3 -' < deploy/scripts/v3-rc70-stage-inventory-readonly.py
