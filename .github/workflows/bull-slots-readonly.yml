name: "BULL empty slots diagnostic (READ ONLY, 2026-10-25)"
on:
  push:
    branches: [ops/capital-v1-readonly-check-20261024]
    paths: ["deploy/bull-slots-readonly.trigger"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile deploy/scripts/bull_slots_diagnostic_20261025.py
      - name: Bull-only read of lessons logs and journals (no commands modifying VPS)
        shell: bash
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SG_SSH_KEY" > "$HOME/.ssh/bull-ro-key"
          chmod 600 "$HOME/.ssh/bull-ro-key"
          cat > "$HOME/.ssh/bull-ro-hosts" <<'HOSTS'
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          HOSTS
          ssh -T -i "$HOME/.ssh/bull-ro-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/bull-ro-hosts" \
            -o ConnectTimeout=20 root@51.79.205.82 'python3 -I -' \
            < deploy/scripts/bull_slots_diagnostic_20261025.py | tee bull-readonly-report.log
          grep -qx 'BULL_READ_ONLY_DIAGNOSTIC_COMPLETE' bull-readonly-report.log
          { echo '## Bull diagnostic: candidate scoring vs gating'; echo '~~~'; cat bull-readonly-report.log; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy runner-only SSH identity
        if: always()
        run: rm -f "$HOME/.ssh/bull-ro-key" "$HOME/.ssh/bull-ro-hosts"
