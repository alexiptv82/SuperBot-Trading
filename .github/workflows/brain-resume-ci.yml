name: Brain single account and research - offline only
on:
  push:
    branches: [work/brain-resume-20261030]
    paths:
      - 'backend/director/brain_scalp/**'
      - 'backend/tests/test_brain_scalp*.py'
      - 'backend/tests/test_brain_ai_context.py'
      - 'backend/tests/test_brain_resume.py'
      - 'backend/tests/test_brain_reclaim_probe.py'
      - 'research/long_reclaim/**'
      - 'research/brain_short_reference/**'
      - '.github/workflows/brain-resume-ci.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests with no keys or market network
        run: |
          python -m compileall -q backend/director/brain_scalp
          PYTHONPATH=backend python -m unittest -v backend.tests.test_brain_scalp_dual backend.tests.test_brain_scalp_group1 backend.tests.test_brain_scalp_group2 backend.tests.test_brain_scalp_group3 backend.tests.test_brain_scalp_group4 backend.tests.test_brain_scalp_group5 backend.tests.test_brain_scalp_group6 backend.tests.test_brain_scalp_reference backend.tests.test_brain_ai_context backend.tests.test_brain_resume backend.tests.test_brain_reclaim_probe
      - name: Protect active bots, original Brain and deployments
        run: |
          test -z "$(git diff --name-only 3e73bbff44946df7dba027e27086009229ebb351 HEAD -- backend/desk backend/director/brain_free deploy frontend Dockerfile.brainfree)"
