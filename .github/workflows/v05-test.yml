name: V0.5 Strategy Engine - Manual Test

# Manual-only workflow for testing the V0.5 strategy engine (backend/backtest_harness.py
# and backend/live_monitor.py). Never triggers on push, never touches main, never
# deploys anything -- completely separate from .github/workflows/deploy.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo di test"
        required: true
        default: "backtest"
        type: choice
        options:
          - backtest
          - live_monitor
      symbols:
        description: "Simboli separati da virgola"
        required: false
        default: "BTC/USDT:USDT,ETH/USDT:USDT,XAU/USDT:USDT,XAG/USDT:USDT"
      candles:
        description: "Numero di candele 1m da scaricare (solo backtest)"
        required: false
        default: "20000"
      holding:
        description: "Holding: numero di barre (backtest) o minuti (live_monitor)"
        required: false
        default: "15"
      stride:
        description: "Stride tra uno step e il successivo (solo backtest)"
        required: false
        default: "10"
      offset_days:
        description: "Giorni indietro da cui far terminare la finestra storica (solo backtest, 0 = fino ad ora)"
        required: false
        default: "0"
      max_hours:
        description: "Durata massima in ore (solo live_monitor, tetto di sicurezza)"
        required: false
        default: "5.5"
      poll_seconds:
        description: "Intervallo di polling in secondi (solo live_monitor)"
        required: false
        default: "60"

jobs:
  run-test:
    runs-on: ubuntu-latest
    # Safety ceiling above max_hours so the job doesn't get killed before
    # live_monitor.py finishes its own graceful shutdown and the artifact
    # upload step runs.
    timeout-minutes: 355
    # Needed only to commit the accumulated checkpoint back to v0.5 after a
    # live_monitor run. v0.5 has no push-triggered workflows, so this commit
    # cannot cascade into anything else (no deploy, no re-trigger).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout v0.5
        uses: actions/checkout@v4
        with:
          ref: v0.5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy python-dotenv

      - name: Run backtest
        if: ${{ inputs.mode == 'backtest' }}
        run: |
          python backtest_harness.py \
            --symbols "${{ inputs.symbols }}" \
            --candles "${{ inputs.candles }}" \
            --holding "${{ inputs.holding }}" \
            --stride "${{ inputs.stride }}" \
            --offset-days "${{ inputs.offset_days }}" \
            --state-out backtest_state.json \
            2>&1 | tee backtest_output.log

      - name: Run live monitor
        if: ${{ inputs.mode == 'live_monitor' }}
        run: |
          python live_monitor.py \
            --symbols "${{ inputs.symbols }}" \
            --holding-minutes "${{ inputs.holding }}" \
            --poll-seconds "${{ inputs.poll_seconds }}" \
            --max-hours "${{ inputs.max_hours }}" \
            --state-in v05_checkpoint.json \
            --state-out v05_checkpoint.json \
            2>&1 | tee live_monitor.log
          cp v05_checkpoint.json live_state.json

      - name: Commit accumulated checkpoint back to v0.5
        if: ${{ always() && inputs.mode == 'live_monitor' }}
        run: |
          if [ ! -f v05_checkpoint.json ]; then
            echo "Nessun checkpoint da salvare (run terminato prima del primo checkpoint)."
            exit 0
          fi
          git config user.name "superbot-v05-bot"
          git config user.email "actions@users.noreply.github.com"
          git add v05_checkpoint.json
          if git diff --cached --quiet; then
            echo "Checkpoint invariato, niente da committare."
          else
            git commit -m "v0.5: aggiorna checkpoint statistiche live_monitor (run ${{ github.run_id }})"
            git push origin HEAD:v0.5
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-test-results-${{ github.run_id }}
          path: |
            backend/backtest_output.log
            backend/backtest_state.json
            backend/live_monitor.log
            backend/live_state.json
            backend/v05_checkpoint.json
          if-no-files-found: ignore
          retention-days: 14
