name: Singapore VPS - read-only preflight

# Independent of all production deployment workflows.
# Runs ONLY by manual workflow_dispatch on this branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          HOSTKEY: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOSTKEY" ]; then
            echo "::error::Configure SINGAPORE_SSH_PRIVATE_KEY and verified SINGAPORE_SSH_KNOWN_HOSTS before running."
            exit 1
          fi
      - name: Read-only diagnostics (Singapore only)
        env:
          KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          HOSTKEY: ${{ secrets.SINGAPORE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/singapore_key
          chmod 600 ~/.ssh/singapore_key
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/singapore_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ubuntu@51.79.205.82 'set -eu; echo "=== HOST ==="; hostname; echo "=== OS ==="; . /etc/os-release; echo "$PRETTY_NAME"; echo "=== MEMORY ==="; free -h; echo "=== DISK ==="; df -h /; echo "=== LOAD ==="; uptime; echo "=== DOCKER PRESENT ==="; command -v docker || true'
