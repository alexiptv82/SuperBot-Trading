name: Sala segnali - modalita dei bot (sola lettura)

# Legge soltanto con che modalita' (paper/live) sono stati avviati i due bot: il valore di DESK_MODE preso
# dall'ambiente del container, se le chiavi Bitget sono presenti (si/no, MAI il valore) e quello che il bot
# scrive nel suo heartbeat e nel log. NON stampa nessun altro segreto, NON scrive, NON ferma, NON riavvia nulla.
# Parte SOLO quando cambia deploy/desk-mode-check.trigger.

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-mode-check.trigger"

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lettura modalita
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            OUT=/tmp/superbot_mode.txt
            : > $OUT
            for P in hawk bull; do
              C=superbot-desk-$P
              echo "=== $P ===" >> $OUT
              docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' $C 2>/dev/null \
                | grep -E '^DESK_MODE=' >> $OUT || echo "DESK_MODE: non presente nell'ambiente del container (vale paper)" >> $OUT
              for V in BITGET_API_KEY BITGET_SECRET_KEY BITGET_PASSPHRASE; do
                N=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' $C 2>/dev/null | grep -E "^${V}=" | head -1 | cut -d= -f2- | wc -c)
                if [ "${N:-0}" -gt 1 ]; then echo "$V: presente" >> $OUT; else echo "$V: VUOTA" >> $OUT; fi
              done
              docker inspect --format 'avviato={{.State.StartedAt}} stato={{.State.Status}}' $C >> $OUT 2>&1 || echo "container non trovato" >> $OUT
              python3 -I - /opt/superbot-desk-data/$P >> $OUT 2>&1 <<'PYEOF' || echo "(heartbeat non leggibile)" >> $OUT
            import json, os, sys, time
            hb = json.load(open(os.path.join(sys.argv[1], "heartbeat.json")))
            print("heartbeat: exec_mode=%s modalita_app=%s versione=%s eta=%ds" % (
                hb.get("exec_mode", "(campo assente nel codice in esecuzione)"), hb.get("mode"),
                hb.get("version", hb.get("code_version", "-")), time.time() - hb.get("ts", 0)))
            h, m, cs = hb.get("hours"), hb.get("macro"), hb.get("claude_schedule")
            print("orari di trading:", ("mode=%s errore=%s" % (h.get("mode"), h.get("error") or "-")) if isinstance(h, dict) else "non presente")
            print("macro:", json.dumps(m, ensure_ascii=False)[:230] if m is not None else "non presente")
            if isinstance(m, dict):
                print("macro modalita': enforce=%s (False = osservazione: registra, non frena) regime_pubblicato=%s osservato=%s" % (
                    m.get("enforce"), m.get("regime"), json.dumps(m.get("observed"), ensure_ascii=False)[:120] if m.get("observed") else "-"))
            print("calendario Claude:", ("modo=%s consentito_ora=%s future=%s errore=%s" % (
                cs.get("mode"), cs.get("allowed"), cs.get("n_future"), cs.get("error") or "-")) if isinstance(cs, dict) else "non presente")
            print("funzioni: reset_keeps_brain=%s close_position=%s trading_enabled=%s" % (
                hb.get("reset_keeps_brain"), hb.get("close_position"), hb.get("trading_enabled")))
            PYEOF
              docker logs $C 2>&1 | grep -E '^\[LIVE_CONNECTOR\] modalit' | tail -1 >> $OUT || true
            done
            # --- Prova a secco del calendario macro DENTRO il container, con una cartella temporanea (non scrive nei dati del bot)
            echo "=== PROVA CALENDARIO MACRO (cartella temporanea) ===" >> $OUT
            docker exec -i superbot-desk-hawk python - >> $OUT 2>&1 <<'PYEOF' || echo "(prova macro non riuscita)" >> $OUT
            import json, tempfile, time
            from desk import macro_calendar as mc
            d = tempfile.mkdtemp()
            now = int(time.time() * 1000)
            m = mc.current(d, now)
            v = mc.heartbeat_view(m)
            print("regime=%s blocco=%s bonus=%s eventi=%s errore=%s" % (v.get("regime"), v.get("blackout"), v.get("conf_bonus"), v.get("n_events"), v.get("error") or "-"))
            print("prossimo:", json.dumps(v.get("next"), ensure_ascii=False)[:200])
            for u in (v.get("upcoming") or [])[:5]:
                print("  in arrivo:", json.dumps(u, ensure_ascii=False)[:160])
            # Simulazione: un CPI fra 10 minuti, nella cartella temporanea. Con il codice in esecuzione dice che cosa farebbe il filtro.
            print("enforcing(cartella temporanea)=%s  enforcing(dati hawk)=%s  enforcing(dati bull)=%s" % (
                mc.enforcing(d), mc.enforcing("/app/data/desk/hawk"), mc.enforcing("/app/data/desk/bull")))
            sim = mc.evaluate([{"ts": now + 10 * 60000, "title": "CPI m/m", "country": "USD", "impact": "High", "src": "ff"}], now)
            sim["enforce"] = mc.enforcing(d)
            sv = mc.heartbeat_view(sim)
            print("SIMULAZIONE CPI tra 10 min -> pubblicato: regime=%s blocco=%s bonus=%s | osservato: %s" % (
                sv.get("regime"), sv.get("blackout"), sv.get("conf_bonus"), json.dumps(sv.get("observed"), ensure_ascii=False)[:140]))
            PYEOF
            echo "DONE"

      - name: Pubblica output
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          ssh -T -i ~/.ssh/id_desk -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            root@51.91.109.45 'cat /tmp/superbot_mode.txt' 2>/dev/null > out.txt || true
          rm -f ~/.ssh/id_desk
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          OUT=$(head -60 out.txt | tr '\n' '|' | sed 's/%/%25/g')
          echo "::notice title=Modalita bot::${OUT}"
          cat out.txt
