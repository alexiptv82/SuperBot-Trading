name: Test seasonality score audit
on:
  push:
    branches: [work/seasonality-audit]
    paths:
      - "deploy/scripts/seasonality_audit.py"
      - "backend/desk/seasonal.py"
      - "backend/tests/test_seasonality_audit.py"
      - ".github/workflows/seasonality-audit-ci.yml"
  pull_request:
    branches: [rule-pool]
    paths:
      - "deploy/scripts/seasonality_audit.py"
      - "backend/desk/seasonal.py"
      - "backend/tests/test_seasonality_audit.py"
      - ".github/workflows/seasonality-audit-ci.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test score-only audit
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s backend/tests -p test_seasonality_audit.py -v
