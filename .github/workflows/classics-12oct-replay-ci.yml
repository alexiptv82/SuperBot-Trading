name: Classics October recovery - offline A/B lab
on:
  push:
    branches: [work/classics-12oct-selective-lab-20261029]
    paths:
      - 'backend/rollback_lab/**'
      - '.github/workflows/classics-12oct-replay-ci.yml'
permissions:
  contents: read
jobs:
  ab-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m compileall -q backend/rollback_lab
      - name: Hawk A/B smoke test synthetic only
        run: python backend/rollback_lab/ab_runner.py --synthetic --days 6 --portfolio hawk --step 8 --output hawk.json
      - name: Bull A/B smoke test synthetic only
        run: python backend/rollback_lab/ab_runner.py --synthetic --days 6 --portfolio bull --step 8 --output bull.json
      - name: Confirm no production files altered
        run: |
          test -z "$(git diff --name-only dc16e0169932c3885908625ce5be321a33b09a0f HEAD -- backend/desk deploy frontend .github/workflows/desk-deploy.yml)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-12oct-synthetic-smoke
          path: |
            hawk.json
            bull.json
