name: RC71 independent on-server web/roles/auth integrity (READ ONLY)
on:
  push:
    branches: [work/v3-rc71-safe-web-cutover-20261107]
    paths: ['.github/workflows/v3-rc71-postdeploy-safety-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Attest web rollback, unchanged JWT, three wallets, stopped bots and denied commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:sNv9lNqWbZFf2Pm5ChIubeQKV5TzKfUWNlGPzCJg96s
          command_timeout: 85s
          script: |
            set -eu
            python3 - <<'PY'
            import hashlib,json,sqlite3,subprocess,urllib.request,urllib.error
            from pathlib import Path
            def docker_inspect(name):
                x=subprocess.run(['docker','inspect',name],capture_output=True,text=True,timeout=8)
                return json.loads(x.stdout)[0] if x.returncode==0 else {}
            def sha(path):
                h=hashlib.sha256()
                with Path(path).open('rb') as f:
                    for p in iter(lambda:f.read(1048576),b''):
                        h.update(p)
                return h.hexdigest()
            def http(path,method='GET'):
                try:
                    req=urllib.request.Request('http://127.0.0.1:8002'+path,method=method)
                    with urllib.request.urlopen(req,timeout=5) as r:return r.status
                except urllib.error.HTTPError as x:return x.code
                except Exception:return 0
            ok=True
            fresh=docker_inspect('superbot')
            prev=docker_inspect('superbot-rc71-previous')
            for key,value in (
                ('NEW_APP_RUNNING',fresh.get('State',{}).get('Running') is True),
                ('NEW_APP_RESTART_ENABLED',fresh.get('HostConfig',{}).get('RestartPolicy',{}).get('Name')=='always'),
                ('ORIGINAL_CONTAINER_PRESERVED_STOPPED',prev.get('State',{}).get('Running') is False),
                ('ORIGINAL_RESTART_DISABLED_TO_PREVENT_CONFLICT',prev.get('HostConfig',{}).get('RestartPolicy',{}).get('Name')=='no'),
                ('ROLLBACK_STATIC_BUILD_PRESENT',Path('/opt/superbot-web/build.rc71-previous/index.html').is_file()),
                ('DEPLOYED_FRONTEND_VERIFIED',sha('/opt/superbot-web/build/index.html')==sha('/opt/superbot-v3-rc71-release/frontend/build/index.html')),
                ('PAPER_API_HEALTH_200',http('/api/health')==200),
                ('OVERVIEW_AUTHENTICATION_401',http('/api/v3/overview')==401),
                ('MUTATING_CLOSE_POST_REFUSED_423',http('/api/desk/close-all','POST')==423),
                ('MUTATING_BRAIN_POST_REFUSED_423',http('/api/v3/brain/close','POST')==423),
                ('BRAIN_PAUSE_PRESERVED',Path('/opt/superbot-v3-paper-runs/brain-v3-rc20261106/pause.flag').is_file()),
            ):
                print('RC71_'+key+'='+str(value));ok &= value
            env=dict(v.split('=',1) for v in fresh.get('Config',{}).get('Env',[]) if '=' in v)
            safe=all(env.get(k)==v for k,v in {
                'TRADING_MODE':'paper','DESK_MODE':'paper',
                'V3_CUTOVER_READONLY':'1',
                'TELEGRAM_COMMANDS_ENABLED':'false',
                'V3_BRAIN_PEER_OBSERVATIONS':'disabled'}.items())
            print('RC71_NEW_APP_SAFE_PAPER_ENVIRONMENT='+str(safe));ok &= safe
            # No password hash, JWT secret, user record or DB contents are ever printed.
            backups=sorted(Path('/opt/superbot-backups').glob('rc71-app-db-*/superbot.db'))
            db_path=Path('/opt/superbot/data/superbot.db')
            auth_ok=False
            if backups and db_path.is_file():
                try:
                    with sqlite3.connect('file:'+str(backups[-1])+'?mode=ro',uri=True) as before, sqlite3.connect('file:'+str(db_path)+'?mode=ro',uri=True) as after:
                        q='SELECT password_hash,token_version,jwt_secret FROM auth_settings WHERE id=1'
                        a=before.execute(q).fetchone()
                        b=after.execute(q).fetchone()
                        auth_ok=bool(a and b and a==b)
                except (sqlite3.Error,OSError):
                    pass
            print('RC71_SAME_LOGIN_PASSWORD_AND_JWT_SECRET='+str(auth_ok));ok &= auth_ok
            for name,count in [('hawk',6),('bull',2)]:
                d=docker_inspect('superbot-desk-'+name)
                root=Path('/opt/superbot-desk-data')/name
                try:
                    pos=json.loads((root/'state_v2.json').read_text())['main']['positions']
                    n=len(pos)
                except (OSError,ValueError,TypeError,KeyError):
                    n=None
                safe=(d.get('State',{}).get('Running') is False and
                     d.get('HostConfig',{}).get('RestartPolicy',{}).get('Name')=='no'
                     and (root/'pause.flag').is_file() and n==count
                     and not any((root/f).exists() for f in (
                       'close_position.flag','close_position.flag.work','reset.flag','reset.flag.work')))
                print('RC71_'+name.upper()+'_POSITIONS_UNCHANGED_AND_PAUSED='+str(safe))
                ok &= safe
            for n in ('falco','toro'):
                unit='superbot-v3-'+n+'-exit.service'
                state=subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True).stdout.strip()
                enabled=subprocess.run(['systemctl','is-enabled',unit],capture_output=True,text=True).stdout.strip()
                safe=state!='active' and enabled=='disabled'
                print('RC71_'+n.upper()+'_EXIT_SERVICE_STILL_INACTIVE='+str(safe))
                ok &= safe
            print('RC71_INDEPENDENT_POSTDEPLOY='+('PASS' if ok else 'FAIL'))
            if not ok:raise SystemExit(2)
            PY
