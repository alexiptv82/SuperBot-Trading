name: Sala segnali - deploy (Hawk + Bull, container separati, paper)

# Deploy di DUE container separati:
#   superbot-desk-hawk  → Portafoglio Hawk ($100/trade, max 10)
#   superbot-desk-bull  → Portafoglio Bull ($350/trade, max 3)
# NON tocca "superbot", nginx, DNS, app HI-TV.
# Parte SOLO quando cambia deploy/desk-deploy.trigger.

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/desk-deploy.trigger"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Hawk + Bull sul VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Variabili live Bitget — lasciate vuote in paper mode (DESK_MODE=paper di default)
          # Per passare a live: imposta DESK_MODE=live e aggiungi le tre chiavi nei GitHub Secrets
          DESK_MODE: ${{ secrets.DESK_MODE }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          # Capitale allocato per portfolio e limite perdita giornaliera
          # Default: 1500$ per bot, max 25% di perdita al giorno
          DESK_HAWK_CAPITAL: ${{ secrets.DESK_HAWK_CAPITAL }}
          DESK_BULL_CAPITAL: ${{ secrets.DESK_BULL_CAPITAL }}
          DESK_DAILY_LOSS_PCT: ${{ secrets.DESK_DAILY_LOSS_PCT }}
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          connect_timeout: 90s
          command_timeout: 30m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,ANTHROPIC_API_KEY,DESK_MODE,BITGET_API_KEY,BITGET_SECRET_KEY,BITGET_PASSPHRASE,DESK_HAWK_CAPITAL,DESK_BULL_CAPITAL,DESK_DAILY_LOSS_PCT
          script: |
            # Hawk and Bull migrated to Singapore; never recreate engines on the old host.
            if [ "$(hostname)" = "vps-ed34e4ce" ]; then
              echo "ERRORE: Hawk e Bull operativi a Singapore. Deploy sul vecchio VPS bloccato prima di qualsiasi modifica."
              exit 1
            fi
            set -e
            # --- Verifica preliminare (sola lettura)
            AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
            DISK_GB=$(df -BG --output=avail /opt | tail -1 | tr -dc '0-9')
            echo "PREFLIGHT: memoria ${AVAIL_MB} MB, disco ${DISK_GB} GB"
            if [ "${AVAIL_MB:-0}" -lt 700 ]; then echo "ERRORE: memoria insufficiente (${AVAIL_MB} MB)"; exit 1; fi
            if [ "${DISK_GB:-0}" -lt 3 ]; then echo "ERRORE: disco insufficiente (${DISK_GB} GB)"; exit 1; fi
            apt-get install -y docker.io git 2>/dev/null || true
            systemctl start docker 2>/dev/null || true

            # --- Aggiorna codice
            if [ -d "/opt/superbot-desk/.git" ]; then
              cd /opt/superbot-desk && git fetch origin rule-pool && git reset --hard origin/rule-pool
            else
              git clone -b rule-pool https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot-desk
              cd /opt/superbot-desk
            fi

            # --- Volume dati separati per ogni portfolio (sopravvivono ai deploy)
            mkdir -p /opt/superbot-desk-data/hawk
            mkdir -p /opt/superbot-desk-data/bull

            # --- Build immagine comune (una sola build, due container)
            cd /opt/superbot-desk
            CODE_VERSION=$(git rev-parse --short HEAD)
            echo "VERSIONE CODICE: ${CODE_VERSION}"
            docker build -t superbot-desk -f Dockerfile.desk .

            # ── HAWK ─────────────────────────────────────────────────────────
            docker stop superbot-desk-hawk 2>/dev/null || true
            docker rm   superbot-desk-hawk 2>/dev/null || true
            docker run -d \
              --name superbot-desk-hawk \
              --restart unless-stopped \
              --memory 768m --cpus 0.5 \
              -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID -e ANTHROPIC_API_KEY \
              -e DESK_PORTFOLIO=hawk \
              -e DESK_CODE_VERSION="${CODE_VERSION}" \
              -e DESK_DATA_DIR=/app/data/desk/hawk \
              -e DESK_MODE="${DESK_MODE:-paper}" \
              -e BITGET_API_KEY -e BITGET_SECRET_KEY -e BITGET_PASSPHRASE \
              -e DESK_HAWK_CAPITAL="${DESK_HAWK_CAPITAL:-1500}" \
              -e DESK_DAILY_LOSS_PCT="${DESK_DAILY_LOSS_PCT:-25}" \
              -v /opt/superbot-desk-data/hawk:/app/data/desk/hawk \
              superbot-desk

            # ── BULL ─────────────────────────────────────────────────────────
            docker stop superbot-desk-bull 2>/dev/null || true
            docker rm   superbot-desk-bull 2>/dev/null || true
            docker run -d \
              --name superbot-desk-bull \
              --restart unless-stopped \
              --memory 768m --cpus 0.5 \
              -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID -e ANTHROPIC_API_KEY \
              -e DESK_PORTFOLIO=bull \
              -e DESK_CODE_VERSION="${CODE_VERSION}" \
              -e DESK_DATA_DIR=/app/data/desk/bull \
              -e DESK_MODE="${DESK_MODE:-paper}" \
              -e BITGET_API_KEY -e BITGET_SECRET_KEY -e BITGET_PASSPHRASE \
              -e DESK_BULL_CAPITAL="${DESK_BULL_CAPITAL:-1500}" \
              -e DESK_DAILY_LOSS_PCT="${DESK_DAILY_LOSS_PCT:-25}" \
              -v /opt/superbot-desk-data/bull:/app/data/desk/bull \
              superbot-desk

            sleep 25
            echo "=== STATO CONTAINER ==="
            docker ps --filter name=superbot-desk --format '{{.Names}} | {{.Status}}'
            echo "=== LOG HAWK (ultimi 6) ==="
            docker logs --tail 6 superbot-desk-hawk 2>&1 | tr '\n' '|' | cut -c1-500
            echo "=== LOG BULL (ultimi 6) ==="
            docker logs --tail 6 superbot-desk-bull 2>&1 | tr '\n' '|' | cut -c1-500
            echo "=== ALTRI CONTAINER ==="
            docker ps --format '{{.Names}} {{.Status}}' | grep -v superbot-desk | tr '\n' '|' | cut -c1-300
