name: Work - app link synthetic tests
on:
  push:
    branches: [work/backend-singapore-audit]
    paths:
      - '.github/workflows/work-app-link-tests.yml'
      - 'deploy/work-audit/app_link/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.110.0 httpx==0.27.0
      - run: python -m unittest discover -s deploy/work-audit/app_link -p test_link.py -v
