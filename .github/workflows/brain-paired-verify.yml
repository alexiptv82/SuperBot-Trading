name: Brain paired - postflight read-only verification
on:
  push:
    branches: [rule-pool]
    paths:
      - deploy/brain-paired-verify.trigger
      - .github/workflows/brain-paired-verify.yml
permissions:
  contents: read
concurrency:
  group: brain-paired-readonly-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read expected app SHA
        run: |
          expected="$(sed -n 's/^sha=//p' deploy/brain-paired-verify.trigger)"
          test "${#expected}" = 40
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'
          echo "EXPECTED_APP_SHA=$expected" >> "$GITHUB_ENV"
          phase="$(sed -n 's/^phase=//p' deploy/brain-paired-verify.trigger)"
          test "$phase" = final || test "$phase" = warmup
          echo "VERIFY_PHASE=$phase" >> "$GITHUB_ENV"
      - name: Read deployed app, frontend labels and PAPER bot metadata
        uses: appleboy/ssh-action@v1.0.0
        env:
          EXPECTED_APP_SHA: ${{ env.EXPECTED_APP_SHA }}
          VERIFY_PHASE: ${{ env.VERIFY_PHASE }}
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:sNv9lNqWbZFf2Pm5ChIubeQKV5TzKfUWNlGPzCJg96s
          command_timeout: 3m
          envs: EXPECTED_APP_SHA,VERIFY_PHASE
          script: |
            set -eu
            python3 - <<'PY'
            import hashlib,json,os,sqlite3,subprocess
            from pathlib import Path
            
            def call(args,**kwargs):
             p=subprocess.run(args,capture_output=True,text=True,timeout=30,**kwargs)
             if p.returncode:raise ValueError('READONLY_COMMAND_FAILED')
             return p.stdout
            
            def main():
             expected={'superbot':os.environ['EXPECTED_APP_SHA'],'superbot-brain-hawk':'5024fbdfe3a9719098f905b28eac5d0feb9848e6','superbot-brain-bull':'5024fbdfe3a9719098f905b28eac5d0feb9848e6','superbot-brain-pilot':'1f2edeb6182029adc96ba7218ad145a7503472a3','superbot-desk-hawk':'89b0dca3e259c548ed82754c2301c7b024d18ff5','superbot-desk-bull':'89b0dca3e259c548ed82754c2301c7b024d18ff5'}
             for name,sha in expected.items():
              item=json.loads(call(['docker','inspect',name]))[0]
              mode=dict(x.split('=',1) for x in item['Config'].get('Env',[]) if '=' in x).get('DESK_MODE')
              assert mode=='paper' and item['State']['Running'],'NOT_RUNNING_PAPER'
              assert item['Config'].get('Labels',{}).get('superbot.sha')==sha,'SHA_MISMATCH'
              health=item['State'].get('Health',{}).get('Status','unknown')
              assert health=='healthy','NOT_HEALTHY'
              print('PAIRED_RUNTIME='+json.dumps({'name':name,'sha':sha,'health':health,'started_at':item['State']['StartedAt'],'restarts':item.get('RestartCount')}))
             code="""import json,sys
            sys.path.insert(0,'/app/backend')
            from desk.brain_profiles_view import read_profiles
            v=read_profiles()
            assert v['mode']=='paper' and v['read_only']
            for p in ('hawk','bull'):
             r=v['profiles'][p]
             assert r['status']=='ok','READER_UNAVAILABLE'
             assert r['system']['heartbeat']=='fresh','HEARTBEAT_STALE'
             assert not r['execution']['operator_paused'],'NEW_PROFILE_PAUSED'
             print(json.dumps({'profile':p,'portfolio':r['portfolio'],'execution':r['execution'],'api_budget':r['api_budget'],'stats':r['stats'],'positions':[{k:x.get(k) for k in ('symbol','side','margin','leverage','notional_entry','floating_pnl','net_close_estimate','age_minutes','decision_source','stale')} for x in r['positions']]}))
            r=v['legacy']
            assert r['status']=='ok','LEGACY_READER_UNAVAILABLE'
            print(json.dumps({'profile':'legacy','open_positions':len(r['positions']),'operator_paused':r.get('system',{}).get('operator_paused')}))
            """
             result=call(['docker','exec','-e','PYTHONDONTWRITEBYTECODE=1','-i','superbot','python','-'],input=code)
             for line in result.splitlines():print('PAIRED_READER='+json.dumps(json.loads(line),allow_nan=False))
             root=Path('/opt/superbot-brain-adaptive');old=Path('/opt/superbot-desk-data/brain')
             baseline=json.loads((root/'api_budget_baseline.json').read_text())
             assert (old/'pause.flag').is_file(),'OLD_NEW_EXPOSURE_NOT_PAUSED'
             assert hashlib.sha256((old/'spend.jsonl').read_bytes()).hexdigest()==baseline['source_sha256'],'LEGACY_SPEND_CHANGED'
             for profile in ('hawk','bull'):
              with sqlite3.connect((root/('brain-'+profile)/'brain.sqlite3').as_uri()+'?mode=ro',uri=True) as db:
               rows=db.execute("SELECT body FROM events WHERE kind='journal' ORDER BY seq DESC LIMIT 40").fetchall()
               kinds=[json.loads(r[0]).get('kind') for r in rows]
               assert 'entry_cycle_failed' not in kinds,'NATIVE_ENTRY_CYCLE_FAILED'
               print('PAIRED_JOURNAL='+json.dumps({'profile':profile,'recent_kinds':kinds[:12]}))
             with sqlite3.connect((root/'brain-api-budget.sqlite3').as_uri()+'?mode=ro',uri=True) as db:
              rows=db.execute('SELECT profile,COUNT(*),SUM(cost) FROM reservations GROUP BY profile').fetchall()
              print('PAIRED_BUDGET='+json.dumps(rows))
             print('PAIRED_READONLY_VERIFICATION=PASS')
            
            def progress():
             for name in ('superbot-brain-pilot','superbot-brain-hawk','superbot-brain-bull'):
              p=subprocess.run(['docker','inspect',name],capture_output=True,text=True,timeout=20)
              if p.returncode:print('PAIRED_PROGRESS='+json.dumps({'name':name,'exists':False}));continue
              d=json.loads(p.stdout)[0]
              mode=dict(x.split('=',1) for x in d['Config'].get('Env',[]) if '=' in x).get('DESK_MODE')
              assert mode=='paper','PAPER_REQUIRED'
              print('PAIRED_PROGRESS='+json.dumps({'name':name,'exists':True,'running':d['State'].get('Running'),'health':d['State'].get('Health',{}).get('Status'),'restarts':d.get('RestartCount')}))
             root=Path('/opt/superbot-brain-adaptive');old=Path('/opt/superbot-desk-data/brain')
             for profile,folder in (('legacy',old),('hawk',root/'brain-hawk'),('bull',root/'brain-bull')):
              path=folder/'status.json';r=json.loads(path.read_text()) if path.is_file() else {}
              print('PAIRED_PROGRESS='+json.dumps({'profile':profile,'pause_flag':(folder/'pause.flag').is_file(),'ts_ms':r.get('ts_ms'),'mode':r.get('mode'),'fresh_fast_data':r.get('fresh_fast_data'),'last_cycle':{k:r.get('last_cycle',{}).get(k) for k in ('called','skip')},'baseline_exists':(root/'api_budget_baseline.json').is_file()}))
            try:
             if os.getenv("VERIFY_PHASE")=="warmup":progress()
             else:main()
            except Exception as exc:
             print('PAIRED_READONLY_VERIFICATION_FAILED='+type(exc).__name__)
             raise SystemExit(1)
            PY
