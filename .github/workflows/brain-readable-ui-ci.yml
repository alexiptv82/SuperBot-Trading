name: Brain readable PAPER dashboard - isolated offline checks
on:
  push:
    branches: [work/brain-simple-dashboard-20261030]
    paths:
      - 'frontend/src/**'
      - 'backend/brain_scalp_snapshot_view.py'
      - '.github/workflows/brain-readable-ui-ci.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
        working-directory: frontend
      - run: yarn react-scripts test --watchAll=false --runInBand --runTestsByPath src/pages/BrainScalpDashboard.test.js src/pages/BrainScalpSimple.test.js
        working-directory: frontend
        env:
          CI: 'true'
      - run: yarn build
        working-directory: frontend
        env:
          CI: 'true'
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.110.0 httpx==0.27.0
      - uses: actions/checkout@v4
        with:
          ref: 908795ea31d623278b2be85fcc93143d5ce482e2
          path: core-fixture
      - name: Validate PAPER producer and authenticated read-only reader
        run: |
          BRAIN_TEST_CORE_ROOT=core-fixture PYTHONPATH=backend python -m unittest -v backend.tests.test_brain_scalp_view backend.tests.test_brain_single_view
          (cd core-fixture && PYTHONPATH=backend python -m unittest -v backend.tests.test_brain_dashboard_data)
      - name: Nothing changed in trading or production deployment
        run: |
          test -z "$(git diff --name-only 22f9394cff2c21755747c9aa1d6d97f89fdbcd64 HEAD -- backend/desk backend/director frontend/build deploy)"
# CI opt-in run for readable single PAPER dashboard; no deploy.
