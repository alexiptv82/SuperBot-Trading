name: RC71 authenticated web cutover safety regression (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc71-safe-web-cutover-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Guard login while refusing all trade-changing API calls
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          V3_CUTOVER_READONLY: '1'
        run: |
          python -m pytest -q -p no:cacheprovider backend/tests/test_v3_cutover_gate.py
          python -m pytest -q -p no:cacheprovider backend/tests/test_v3_dashboard_unified.py backend/tests/test_v3_dashboard_manual_close.py backend/tests/test_v3_classic_close_offline.py backend/tests/test_v3_classic_exit_only.py
      - name: Syntax-check protected production app route guard
        run: python -m py_compile backend/server.py backend/v3/cutover_gate.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Test unified overview
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=Overview
      - name: Build the real same-origin web application
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
