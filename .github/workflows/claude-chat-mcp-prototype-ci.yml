name: Claude chat MCP read-only prototype CI (NO VPS)
on:
  push:
    branches: [ops/claude-chat-mcp-readonly-20261025]
    paths:
      - "integrations/claude_mcp_readonly/**"
      - ".github/workflows/claude-chat-mcp-prototype-ci.yml"
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax only
        run: python -m py_compile integrations/claude_mcp_readonly/server.py
      - name: Install MCP protocol and verify imports
        run: python -m pip install --disable-pip-version-check "mcp>=2,<3" "starlette>=0.40,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "asgi-lifespan>=2,<3"
      - name: Verify no-auth is blocked without touching any VPS
        env:
          MCP_BEARER_TOKEN: "test-only-64-char-access-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          PYTHONPATH: integrations/claude_mcp_readonly
        run: |
          python - <<'PY'
          import asyncio
          from httpx import ASGITransport, AsyncClient
          from asgi_lifespan import LifespanManager
          from server import app
          async def check():
              async with LifespanManager(app):
               async with AsyncClient(transport=ASGITransport(app=app),base_url="http://127.0.0.1:8765") as c:
                  for headers in ({}, {"Authorization":"Bearer wrong-key"},):
                      response=await c.post("/mcp", headers=headers, json={"jsonrpc":"2.0","id":1,"method":"initialize","params":{}})
                      assert response.status_code==401, (headers,response.status_code)
                  response=await c.post("/mcp",headers={
                      "Authorization":"Bearer "+__import__("os").environ["MCP_BEARER_TOKEN"],
                      "Accept":"application/json, text/event-stream",
                      "Content-Type":"application/json",
                    },json={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","clientInfo":{"name":"mcp-smoke","version":"0.1"},"capabilities":{}}})
                  assert response.status_code==200, (response.status_code,response.text[:300])
                  assert "protocolVersion" in response.text, response.text[:300]
              print("PASS: unauthorized blocked and valid MCP initialized; no VPS, no Docker, no tokens output")
          asyncio.run(check())
          PY
