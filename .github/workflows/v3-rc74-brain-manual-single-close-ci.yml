name: RC74 Brain individual PAPER manual close safety (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc74-brain-manual-single-exit-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Brain close crash recovery, isolated journal, no accidental full-close and classic regression
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          V3_CUTOVER_READONLY: '0'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_runner_manual_close.py \
            backend/tests/test_v3_brain_single_close_readiness.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_classic_manual_close_mutex.py \
            backend/tests/test_v3_classic_exit_only.py \
            backend/tests/test_v3_cutover_gate.py
          python -m py_compile backend/v3_api.py backend/server.py backend/v3/runner/manual_close.py backend/v3/runner/runner.py backend/v3/cutover_gate.py
  react-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Check manual Brain close confirmations and all existing wallet views
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand
      - name: Build production frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
