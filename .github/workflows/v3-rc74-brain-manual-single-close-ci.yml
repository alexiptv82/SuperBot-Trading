name: RC74 Brain single manual PAPER exit with paused AI (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc74-brain-single-manual-close-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brain-manual-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Verify independent exit-owner lease, idempotent requests, journal, API and cutover barrier
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          TRADING_MODE: paper
          V3_CUTOVER_READONLY: '1'
          V3_ALLOW_BRAIN_SINGLE_CLOSE: '0'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_brain_single_manual_close_gate.py \
            backend/tests/test_v3_runner_manual_close.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_exit_service.py \
            backend/tests/test_v3_exit_worker.py \
            backend/tests/test_v3_cutover_gate.py
      - name: Check Python code has no import-time side effects/syntax mistakes
        run: python -m py_compile backend/v3_api.py backend/server.py backend/v3/cutover_gate.py backend/v3/runner/manual_close.py backend/v3/runner/exit_service.py
  brain-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Brain and Classic three-wallet UI regressions
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand
      - name: Full UI build, no deploy
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
