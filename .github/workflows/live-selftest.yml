name: Prova collegamento Bitget (importo MINIMO, soldi veri)

# Prova il collegamento reale con Bitget usando poche decine di centesimi: apre una posizione minima
# (margine <= 5$) con stop e take profit, sposta stop/TP, aggiunge, riduce, chiude e controlla che l'account
# torni piatto e senza stop rimasti. Poi scrive il rapporto in deploy/live-selftest-output-<bot>.txt.
#
# Ogni bot ha il SUO sub-account Bitget: la prova gira su un sub-account alla volta. Quale lo decide la prima
# parola del file deploy/live-selftest.trigger ("hawk" oppure "bull"); usa le chiavi di trading di quel bot
# (BITGET_HAWK_* / BITGET_BULL_*), mai la vecchia chiave condivisa.
#
# - NON tocca i bot (superbot-desk-hawk / -bull), i loro dati, i loro flag, ne' il loro codice in esecuzione.
# - Gira in un container usa-e-getta (immagine "superbot-selftest", diversa da quella dei bot).
# - Si ferma subito se l'account Bitget ha gia' posizioni aperte.
# - Parte SOLO quando cambia deploy/live-selftest.trigger (lo cambia chi vuole fare la prova).
#   Non lanciarla mentre i bot sono in live con posizioni aperte.

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/live-selftest.trigger"

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Quale sub-account (prima parola di deploy/live-selftest.trigger)
        id: bot
        run: |
          B=$(head -n1 deploy/live-selftest.trigger | awk '{print tolower($1)}')
          if [ "$B" != "hawk" ] && [ "$B" != "bull" ]; then
            echo "ERRORE: la prima parola di deploy/live-selftest.trigger deve essere 'hawk' o 'bull' (trovato: '$B')"
            exit 1
          fi
          echo "bot=$B" >> "$GITHUB_OUTPUT"

      - name: Prova sul VPS (container usa-e-getta)
        uses: appleboy/ssh-action@v1.0.0
        env:
          SELFTEST_BOT: ${{ steps.bot.outputs.bot }}
          BITGET_HAWK_API_KEY: ${{ secrets.BITGET_HAWK_API_KEY }}
          BITGET_HAWK_SECRET_KEY: ${{ secrets.BITGET_HAWK_SECRET_KEY }}
          BITGET_HAWK_PASSPHRASE: ${{ secrets.BITGET_HAWK_PASSPHRASE }}
          BITGET_BULL_API_KEY: ${{ secrets.BITGET_BULL_API_KEY }}
          BITGET_BULL_SECRET_KEY: ${{ secrets.BITGET_BULL_SECRET_KEY }}
          BITGET_BULL_PASSPHRASE: ${{ secrets.BITGET_BULL_PASSPHRASE }}
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          connect_timeout: 90s
          command_timeout: 20m
          envs: SELFTEST_BOT,BITGET_HAWK_API_KEY,BITGET_HAWK_SECRET_KEY,BITGET_HAWK_PASSPHRASE,BITGET_BULL_API_KEY,BITGET_BULL_SECRET_KEY,BITGET_BULL_PASSPHRASE
          script: |
            set -e
            OUT="/tmp/live_selftest_${SELFTEST_BOT}.txt"
            echo "Sub-account provato: ${SELFTEST_BOT}" > "$OUT"
            case "$SELFTEST_BOT" in
              hawk) K="$BITGET_HAWK_API_KEY"; S="$BITGET_HAWK_SECRET_KEY"; P="$BITGET_HAWK_PASSPHRASE" ;;
              bull) K="$BITGET_BULL_API_KEY"; S="$BITGET_BULL_SECRET_KEY"; P="$BITGET_BULL_PASSPHRASE" ;;
              *)    echo "Bot non valido: ${SELFTEST_BOT}" >> "$OUT"; exit 0 ;;
            esac
            if [ -z "$K" ] || [ -z "$S" ] || [ -z "$P" ]; then
              echo "NON ESEGUITA: mancano uno o piu' Secrets di trading di ${SELFTEST_BOT} (BITGET_$(echo "$SELFTEST_BOT" | tr a-z A-Z)_API_KEY / _SECRET_KEY / _PASSPHRASE)." >> "$OUT"
              cat "$OUT"
              exit 0
            fi
            export BITGET_API_KEY="$K" BITGET_SECRET_KEY="$S" BITGET_PASSPHRASE="$P"
            rm -rf /opt/superbot-selftest
            git clone --depth 1 -b rule-pool https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot-selftest
            cd /opt/superbot-selftest
            docker build -t superbot-selftest -f Dockerfile.desk . > /tmp/selftest_build.txt 2>&1 || { tail -20 /tmp/selftest_build.txt; echo "BUILD FALLITA" >> "$OUT"; exit 0; }
            docker run --rm --name superbot-selftest-run --memory 512m --cpus 0.5 \
              -e DESK_MODE=live -e DESK_PORTFOLIO="${SELFTEST_BOT}" -e DESK_DATA_DIR=/tmp/selftest \
              -e BITGET_API_KEY -e BITGET_SECRET_KEY -e BITGET_PASSPHRASE \
              superbot-selftest python -m desk.live_selftest --yes-real-money --symbol XRP --margin 3 --lev 5 \
              >> "$OUT" 2>&1 || true
            tail -60 "$OUT"
            rm -rf /opt/superbot-selftest

      - name: Porta il rapporto nel repo
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BOT: ${{ steps.bot.outputs.bot }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 "cat /tmp/live_selftest_${BOT}.txt 2>/dev/null || echo 'nessun rapporto prodotto'; rm -f /tmp/live_selftest_${BOT}.txt /tmp/selftest_build.txt" > "deploy/live-selftest-output-${BOT}.txt"
          rm -f ~/.ssh/id_tmp
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add "deploy/live-selftest-output-${BOT}.txt"
          git diff --staged --quiet || git commit -m "live: rapporto prova collegamento Bitget (${BOT}) [skip ci]"
          git push origin rule-pool
