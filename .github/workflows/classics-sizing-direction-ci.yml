name: PAPER classical sizing direction - isolated offline validation
on:
  push:
    branches: [work/classics-sizing-direction-20261028]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy pandas ccxt==4.2.95 tzdata
      - name: Bytecode compile
        run: python -m compileall -q backend/desk/cli.py backend/desk/engine.py backend/desk/brain.py backend/desk/deepseek_collab.py
      - name: Full active classical regression suite (network blocked by conftest)
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_classics_sizing_direction_20261028.py
          backend/tests/test_classics_deepseek_collab.py
          backend/tests/test_classics_macro_observation_12oct.py
          backend/tests/test_desk.py backend/tests/test_desk_macro.py
          backend/tests/test_desk_hours.py backend/tests/test_desk_fixes_2026_10_20.py
          backend/tests/test_profit_correctness_proposals.py
          backend/tests/test_classic_rollback_vault.py backend/tests/test_capital_journal_v1.py
          backend/tests/test_capital_engine_integration_v1.py
          backend/tests/test_live_connector.py backend/tests/test_live_sync.py
          backend/tests/test_live_selftest.py backend/tests/test_rule_pool_runner.py
      - name: Deploy guards and backup/restore (temporary data and fake Docker only)
        run: >-
          python -m unittest
          deploy/scripts/test_backup_scripts.py
          deploy/scripts/test_deploy_workflow.py
          deploy/scripts/test_fix_a_deploy_guards.py
      - name: Docker build only - no orders and no VPS deployment
        run: docker build -f Dockerfile.desk -t superbot-classic-sizing-offline .
      - name: Brain Libero and unrelated runtime not modified
        run: |
          git fetch --depth=1 origin 835a4f25a676f0bcab38a28b75e23402cefe298b
          test -z "$(git diff --name-only 835a4f25a676f0bcab38a28b75e23402cefe298b HEAD -- backend/director/brain_free backend/director/brain_pilot backend/director/brain_classical)"
