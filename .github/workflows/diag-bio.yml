name: Diagnosi login e impronta (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Diagnosi (nessun segreto viene stampato)
        run: |
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }
          note "ora server (UTC)" "$(date -u '+%F %T')"
          NG=$(grep -E '/api/auth/' /var/log/nginx/access.log | grep -v 'curl/' | sed -E 's/^[^ ]+ - [^ ]+ //' | sed -E 's/"-" "Mozilla[^"]*(Chrome\/[0-9.]+)[^"]*"/\1/' | cut -c1-140 | tail -40)
          note "nginx: chiamate /api/auth dai browser (senza IP)" "${NG:-nessuna}"
          RES=$(python3 - <<'PY'
          import sqlite3
          out = []
          con = sqlite3.connect('file:/opt/superbot/data/superbot.db?mode=ro', uri=True)
          out.append('auth_settings: hash_impostato=%s cambiata_il=%s token_version=%s' % con.execute('select password_hash is not null, password_changed_at, token_version from auth_settings where id=1').fetchone())
          rows = con.execute('select id, device_label, created_at, sign_count from webauthn_credentials').fetchall()
          out.append('credenziali impronta registrate: %d %s' % (len(rows), [(r[1], str(r[2])[:19]) for r in rows]))
          for ts, ev, msg in con.execute("select timestamp, event_type, message from audit_log where event_type like 'auth%' order by id desc limit 14"):
              out.append('audit: %s %s' % (str(ts)[:19], ev))
          print('\n'.join(out))
          PY
          )
          note "Stato nel DB" "$RES"
          LG=$(docker logs --since 3h superbot 2>&1 | grep -iE 'webauthn|traceback|error|exception|verif' | sed -E 's/bot[0-9]+:[A-Za-z0-9_-]+/bot***/g' | cut -c1-230 | tail -12)
          note "container: righe webauthn/errori (ultime 3h)" "${LG:-nessuna}"
          UV=$(docker logs --since 3h superbot 2>&1 | grep -E 'api/auth' | sed -E 's/[0-9a-fA-F.:]+:[0-9]+ - //' | tail -25)
          note "container: chiamate auth" "${UV:-nessuna}"
          REMOTE
