name: Brain position execution chat offline CI
on:
  push:
    branches: [work/brain-position-execution-chat-20261030]
    paths:
      - 'backend/**'
      - '.github/workflows/brain-position-execution-chat-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=backend python -m pytest -q backend/tests/test_brain_position_execution_chat.py backend/tests/test_brain_position_review_chat.py backend/tests/test_brain_resume.py backend/tests/test_brain_ai_context.py backend/tests/test_brain_single_integration.py backend/tests/test_brain_operator.py backend/tests/test_brain_manual_preferences.py backend/tests/test_brain_teaching_recovery_service.py
      - name: Verify classical and live execution unchanged
        run: |
          test -z "$(git diff --name-only 895b34a64058b1321ba5ad372e8de435f3e7fec0 HEAD -- backend/desk backend/director/brain_free frontend deploy backend/director/brain_scalp/engine.py backend/director/brain_scalp/scanner.py)"
