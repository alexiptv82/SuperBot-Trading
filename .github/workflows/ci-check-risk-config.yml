name: CI check risk config (temporaneo)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Test auth (pytest, SQLite reale)
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m pytest tests/test_auth_flow.py -q -p no:cacheprovider 2>&1 | tail -40 > /tmp/pytest.out; RC=${PIPESTATUS[0]}
          cat /tmp/pytest.out
          SUMMARY=$(tail -3 /tmp/pytest.out | tr '\n' ' ')
          if [ "$RC" -eq 0 ]; then echo "::notice title=pytest auth::${SUMMARY}"; else echo "::error title=pytest auth FALLITO::$(grep -E 'FAILED|Error|assert' /tmp/pytest.out | head -12 | tr '\n' ' | ')"; exit 1; fi
      - name: Build frontend
        working-directory: frontend
        run: |
          REACT_APP_BACKEND_URL= npm install --no-audit --no-fund
          REACT_APP_BACKEND_URL= npm run build 2>&1 | tail -25
          echo "::notice title=Frontend build::OK"
