name: V3 three equal PAPER portfolios (NO DEPLOY)
on:
  push:
    branches: [work/v3-dashboard-three-equal-portfolios-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Three portfolio parity, close-control, layout and existing Overview regressions
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=Overview
      - name: Create production bundle
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Verify no regression in wallet read, close and exit-only worker
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          DESK_PORTFOLIO: hawk
          DESK_MACRO_FETCH: '0'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_dashboard_unified.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_classic_exit_only.py \
            backend/tests/test_v3_classic_close_offline.py \
            backend/tests/test_desk_view.py
