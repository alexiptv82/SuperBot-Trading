name: Hawk Bull 12-Oct parameters + macro informational-only regression
on:
  push:
    branches: [work/classics-macro-observe-oct12-20261028]
permissions:
  contents: read
jobs:
  paper-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest numpy pandas ccxt==4.2.95 tzdata
      - name: Compile all modified components
        run: python -m compileall -q backend/desk/macro_calendar.py backend/desk/cli.py backend/desk/deepseek_collab.py
      - name: Entry safety + news observation + old enforce tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_classics_macro_observation_12oct.py backend/tests/test_classics_deepseek_collab.py backend/tests/test_desk_macro.py backend/tests/test_desk_hours.py backend/tests/test_classic_rollback_vault.py backend/tests/test_desk.py backend/tests/test_capital_journal_v1.py
      - name: Build PAPER bot image offline, NO deploy
        run: docker build -f Dockerfile.desk -t classics-macro-observe-test .
      - name: Brain Free and unrelated directors unchanged
        run: |
          git fetch --depth=1 origin ef0f596c41b8cda208dc9c9a79b7bb364640f6f7
          test -z "$(git diff --name-only ef0f596c41b8cda208dc9c9a79b7bb364640f6f7 HEAD -- backend/director/brain_free backend/director/brain_pilot backend/director/brain_classical)"
