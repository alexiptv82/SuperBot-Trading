name: 'SuperBot V3 F1 - audit storico snapshot READ ONLY'
on:
  workflow_dispatch:
  push:
    branches: [work/v3-foundations-event-risk-20261102]
    paths: [deploy/v3-legacy-audit.trigger]

permissions:
  contents: read

concurrency:
  group: superbot-v3-legacy-audit-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate payload and immutable target
        run: |
          set -euo pipefail
          python -m compileall -q backend/v3 deploy/scripts/v3-legacy-audit-payload.py deploy/scripts/v3-legacy-readonly-audit-remote.py
          grep -Fxq 'authorization=READ_ONLY_BACKUP_AUDIT' deploy/v3-legacy-audit.trigger
          grep -Fxq 'target=OFFLINE_RESTORE_TEST' deploy/v3-legacy-audit.trigger
      - name: Audit immutable snapshot via pinned Singapore SSH
        env:
          SINGAPORE_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SINGAPORE_KEY:-}" || { echo 'MISSING_SSH_KEY'; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SINGAPORE_KEY" > "$HOME/.ssh/v3_key"
          chmod 600 "$HOME/.ssh/v3_key"
          trap 'rm -f "$HOME/.ssh/v3_key"' EXIT
          cat > "$HOME/.ssh/known_hosts" <<'HOSTKEY'
          51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj
          HOSTKEY
          chmod 600 "$HOME/.ssh/known_hosts"
          python3 deploy/scripts/v3-legacy-audit-payload.py | ssh -T \
            -i "$HOME/.ssh/v3_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            root@51.79.205.82 'python3 -'
