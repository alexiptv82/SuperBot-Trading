name: RC74 complete V3 PAPER regression after Brain manual close (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc74-brain-single-manual-close-20261107]
    paths: ['.github/workflows/v3-rc74-full-v3-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: All V3 PAPER API, journal, Brain, classic risk and manual close regressions
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          TRADING_MODE: paper
          DESK_MACRO_FETCH: '0'
          V3_CUTOVER_READONLY: '1'
          V3_ALLOW_BRAIN_SINGLE_CLOSE: '0'
        run: |
          python -m pytest -q -p no:cacheprovider backend/tests/test_v3_*.py
          python -m pytest -q -p no:cacheprovider backend/tests/test_brain_f5b_paper_close.py
