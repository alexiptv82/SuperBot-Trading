name: Brain dashboard - offline tests (no deploy)

on:
  push:
    branches: [work/brain-portfolio-view]
    paths:
      - backend/desk/brain_view.py
      - backend/tests/test_brain_view.py
      - backend/server.py
      - frontend/**
      - .github/workflows/brain-view-ci.yml
  pull_request:
    branches: [rule-pool]
    paths:
      - backend/desk/brain_view.py
      - backend/tests/test_brain_view.py
      - backend/server.py
      - frontend/**
      - .github/workflows/brain-view-ci.yml

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install fastapi==0.110.0 httpx==0.27.0
      - name: Offline SQLite, WAL, timeout, auth and preservation tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_brain_view.py -v
      - name: Check Python syntax (do not import bot/server runtime)
        run: python -m py_compile backend/desk/brain_view.py backend/server.py
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Offline component rendering and poll lifecycle
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand --testPathPattern=BrainDashboard.test.js
      - name: Production PWA build
        env:
          CI: 'false' # Existing unrelated dashboard warnings are not this feature's gate.
          REACT_APP_BACKEND_URL: ''
        run: npm run build
