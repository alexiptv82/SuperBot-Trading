name: Verifica profili dopo deploy (temporaneo, sola lettura)
# Solo sul ramo risk-profiles (non va su main). Nessun segreto stampato,
# nessun messaggio Telegram, nessuna scrittura sul DB.
on:
  push:
    branches: [risk-profiles]
    paths: [".github/workflows/diag-profiles-deploy.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verifica
        run: |
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g' | cut -c1-900)"; }
          note "Container" "$(docker ps --filter name=^superbot$ --format '{{.Names}} {{.Status}}')"
          note "Health" "$(curl -sS -m 10 https://superbot-trading.duckdns.org/api/health 2>&1)"
          note "API protetta senza token (deve dare 401)" "$(curl -sS -m 10 -o /dev/null -w 'HTTP %{http_code}' https://superbot-trading.duckdns.org/api/bot/config)"
          DB=$(ls /opt/superbot/data/*.db 2>/dev/null | head -1)
          note "DB" "$DB"
          python3 - "$DB" <<'PY' > /tmp/dbcheck.txt 2>&1
          import sqlite3, sys
          con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          cols = lambda t: [r[1] for r in con.execute(f"pragma table_info({t})")]
          print("trades colonne nuove:", [c for c in cols("trades") if c in ("profile","margin","liq_price","gross_pnl","fees")])
          print("risk_settings colonne:", cols("risk_settings"))
          print("risk_mode salvato:", con.execute("select risk_mode from risk_settings limit 1").fetchall())
          print("trade totali:", con.execute("select count(*) from trades").fetchone()[0])
          print("per profilo/stato:", con.execute("select coalesce(profile,'(vecchio)'), status, count(*) from trades group by 1,2").fetchall())
          PY
          note "Database" "$(cat /tmp/dbcheck.txt)"
          note "Log del bot (ultime righe senza dati sensibili)" "$(docker logs --tail 400 superbot 2>&1 | grep -iE 'portaf|profil|avviat|Traceback|ERROR|migraz' | tail -12 | cut -c1-200)"
          REMOTE
