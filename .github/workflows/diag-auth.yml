name: Diagnosi login (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnosi (nessun valore segreto viene stampato)
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }

          # Lato GitHub: solo proprieta' non sensibili del secret
          LEN=${#DASHBOARD_PASSWORD}
          WS=no; [[ $DASHBOARD_PASSWORD =~ ^[[:space:]]|[[:space:]]$ ]] && WS=SI
          NL=no; [[ $DASHBOARD_PASSWORD == *$'\n'* ]] && NL=SI
          note "Secret DASHBOARD_PASSWORD su GitHub" "presente=$([ "$LEN" -gt 0 ] && echo SI || echo NO) lunghezza=$LEN spazi_ai_bordi=$WS a_capo=$NL"
          SHA=$(printf %s "$DASHBOARD_PASSWORD" | sha256sum | cut -d' ' -f1)

          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 "EXPECTED_SHA=$SHA bash -s" <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }

          RES=$(python3 - <<'PY'
          import base64, hashlib, hmac, os, sqlite3
          out = []
          env = {}
          for line in open('/opt/superbot/backend/.env', errors='replace'):
              if '=' in line:
                  k, v = line.rstrip('\n').split('=', 1)
                  env[k] = v
          b64 = env.get('DASHBOARD_PASSWORD_B64', '')
          boot = ''
          try:
              boot = base64.b64decode(b64).decode()
          except Exception as e:
              out.append('decodifica base64 fallita: ' + type(e).__name__)
          sha = lambda s: hashlib.sha256(s.encode()).hexdigest()
          exp = os.environ.get('EXPECTED_SHA', '')
          nl = ('\n' in boot) or ('\r' in boot)
          quotes = ("'" in boot) or ('"' in boot)
          shellish = any(c in boot for c in '$`\\!')
          out.append('password iniziale sul server: presente=%s lunghezza=%d spazi_ai_bordi=%s a_capo=%s non_ascii=%s apici_o_virgolette=%s dollaro_backtick_backslash_esclamativo=%s' % (
              bool(boot), len(boot), boot != boot.strip(), nl, any(ord(c) > 127 for c in boot), quotes, shellish))
          out.append('identica al secret GitHub: %s' % (sha(boot) == exp))
          out.append('identica al secret GitHub (dopo trim): %s' % (sha(boot.strip()) == exp))

          db = '/opt/superbot/data/superbot.db'
          out.append('db esiste: %s' % os.path.exists(db))
          con = sqlite3.connect('file:%s?mode=ro' % db, uri=True)
          row = con.execute('select password_hash, password_changed_at, token_version, jwt_secret is not null from auth_settings where id=1').fetchone()
          if row is None:
              out.append('auth_settings: riga assente')
          else:
              h, changed, ver, has_key = row
              out.append('auth_settings: hash_impostato=%s cambiata_il=%s token_version=%s chiave_jwt=%s' % (bool(h), changed, ver, bool(has_key)))
              if h:
                  def vh(pw):
                      try:
                          algo, n, r, p, salt, dk = h.split('$')
                          expected = base64.b64decode(dk)
                          got = hashlib.scrypt(pw.encode(), salt=base64.b64decode(salt), n=int(n), r=int(r), p=int(p), dklen=len(expected))
                          return hmac.compare_digest(got, expected)
                      except Exception as e:
                          return 'errore ' + type(e).__name__
                  out.append('hash nel DB corrisponde alla password iniziale: %s' % vh(boot))
          for ts, ev, msg in con.execute("select timestamp, event_type, message from audit_log where event_type like 'auth%' order by id desc limit 12"):
              out.append('audit: %s %s %s' % (str(ts)[:19], ev, msg))
          print('\n'.join(out))
          PY
          )
          note "Stato login sul server" "$RES"

          LOGS=$(docker logs --since 12h superbot 2>&1 | grep -E 'api/auth' | sed -E 's/[0-9a-fA-F.:]+:[0-9]+ - //' | tail -15)
          note "Ultime chiamate /api/auth (ultime 12h, senza IP)" "${LOGS:-nessuna}"
          note "Container" "$(docker ps --filter name=superbot --format '{{.Names}} {{.Status}}')"
          REMOTE
