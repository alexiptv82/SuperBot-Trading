name: Diagnosi login (temporaneo, sola lettura)
on:
  push:
    branches: [ci-check-risk-config]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 51.91.109.45 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnosi rete e frontend (nessun segreto viene stampato)
        run: |
          set +e
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 root@51.91.109.45 'bash -s' <<'REMOTE'
          set +e
          note() { printf '::notice title=%s::%s\n' "$1" "$(echo "$2" | tr '\n' '|' | sed 's/::/: /g')"; }

          BASE=$(grep -oh 'baseURL:[^,}]\{0,80\}' /opt/superbot/frontend/build/static/js/main.*.js | head -3)
          note "baseURL nel frontend compilato" "${BASE:-non trovato}"
          note "file main.js" "$(ls -la --time-style=long-iso /opt/superbot/frontend/build/static/js/main.*.js | awk '{print $6, $7, $8}')"

          NG=$(tail -n 6000 /var/log/nginx/access.log 2>&1 | grep -E '/api/auth/(login|change-password|webauthn/status)' | sed -E 's/^[^ ]+ - [^ ]+ //' | cut -c1-230 | tail -14)
          note "nginx: ultime chiamate auth (senza IP)" "${NG:-nessuna}"

          NGA=$(tail -n 6000 /var/log/nginx/access.log 2>&1 | grep -E 'GET / |GET /static/js/main' | sed -E 's/^[^ ]+ - [^ ]+ //' | cut -c1-200 | tail -4)
          note "nginx: ultimi caricamenti pagina" "${NGA:-nessuno}"

          note "ora server (UTC)" "$(date -u '+%F %T')"
          REMOTE
