name: RC73 final PAPER manual-single-close safety gate (NO DEPLOY)
on:
  push:
    branches: [work/v3-rc73-manual-close-idempotency-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir pytest fastapi==0.110.0 httpx==0.27.0 numpy
      - name: Double tap, cross-portfolio, lock, price-failure and backend gate
        env:
          PYTHONPATH: .:backend
          DESK_MODE: paper
          V3_CUTOVER_READONLY: '1'
          V3_ALLOW_CLASSIC_SINGLE_CLOSE: '0'
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_v3_classic_manual_close_mutex.py \
            backend/tests/test_v3_classic_exit_only.py \
            backend/tests/test_v3_classic_close_offline.py \
            backend/tests/test_v3_dashboard_manual_close.py \
            backend/tests/test_v3_cutover_gate.py \
            backend/tests/test_v3_dashboard_unified.py
      - run: python -m py_compile backend/server.py backend/v3_api.py backend/desk_view.py backend/desk/exit_only.py backend/v3/cutover_gate.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Three wallets and single-close UI, complete frontend regressions
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand
      - name: Final production build
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
