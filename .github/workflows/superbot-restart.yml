name: SuperBot FastAPI - restart emergenza

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-restart.trigger"

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart container superbot (FastAPI)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.79.205.82
          username: root
          key: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "=== STATO PRIMA ==="
            docker ps -a --filter name=^superbot$ --format "{{.Names}} | {{.Status}}"
            echo "=== RESTART ==="
            docker restart superbot 2>&1 || docker start superbot 2>&1
            sleep 8
            echo "=== STATO DOPO ==="
            docker ps -a --filter name=^superbot$ --format "{{.Names}} | {{.Status}}"
            echo "=== LOG ULTIMI 20 ==="
            docker logs --tail 20 superbot 2>&1
