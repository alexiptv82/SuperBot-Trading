name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Raccoglie log e salva diag-output.txt
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp

          ssh -i ~/.ssh/id_tmp \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            root@51.91.109.45 \
            'OUT=/tmp/diag502.txt
            echo "=== CONTAINERS ===" > $OUT
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Status}}" >> $OUT 2>/dev/null
            echo "" >> $OUT
            echo "=== INSPECT ===" >> $OUT
            docker inspect superbot --format "Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}" >> $OUT 2>/dev/null
            echo "" >> $OUT
            echo "=== LOG SUPERBOT ===" >> $OUT
            docker logs --tail 100 superbot >> $OUT 2>&1
            echo "" >> $OUT
            echo "=== MEM ===" >> $OUT
            free -m >> $OUT
            echo "=== DISCO ===" >> $OUT
            df -h / >> $OUT'

          scp -i ~/.ssh/id_tmp \
            -o StrictHostKeyChecking=accept-new \
            root@51.91.109.45:/tmp/diag502.txt \
            deploy/diag-output.txt

          rm -f ~/.ssh/id_tmp
          echo "--- CONTENUTO ---"
          cat deploy/diag-output.txt

      - name: Committa nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: log docker superbot [skip ci]"
          git push origin rule-pool
