name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Raccoglie log dal VPS via SSH nativo
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_diag
          chmod 600 ~/.ssh/id_diag

          ssh -T -i ~/.ssh/id_diag \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            root@51.91.109.45 << 'REMOTE'
            OUT=/tmp/diag502.txt
            echo "=== CONTAINERS ===" > $OUT
            docker ps -a --format "{{.Names}} | {{.Status}} | RestartCount={{.RunningFor}}" | grep superbot >> $OUT 2>/dev/null || echo "(nessuno)" >> $OUT

            echo "" >> $OUT
            echo "=== SUPERBOT INSPECT ===" >> $OUT
            docker inspect superbot --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} Error={{.State.Error}}' >> $OUT 2>/dev/null || echo "container non trovato" >> $OUT

            echo "" >> $OUT
            echo "=== LOG SUPERBOT (ultimi 80) ===" >> $OUT
            docker logs --tail 80 superbot 2>&1 >> $OUT || echo "nessun log" >> $OUT

            echo "" >> $OUT
            echo "=== MEMORIA ===" >> $OUT
            free -m >> $OUT
            echo "" >> $OUT
            echo "=== DISCO ===" >> $OUT
            df -h / >> $OUT
            echo "FINE" >> $OUT
REMOTE

          ssh -T -i ~/.ssh/id_diag \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            root@51.91.109.45 \
            'cat /tmp/diag502.txt' > deploy/diag-output.txt 2>/dev/null || echo "SSH FALLITO" > deploy/diag-output.txt

          rm -f ~/.ssh/id_diag
          cat deploy/diag-output.txt

      - name: Committa output nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: log superbot 502 [skip ci]"
          git push origin rule-pool
