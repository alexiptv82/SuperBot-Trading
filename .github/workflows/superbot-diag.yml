name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-permissions:
  contents: write

on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Raccoglie log dal VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            OUT=/tmp/diag502.txt
            echo "=== CONTAINERS ===" > $OUT
            docker ps -a --format "{{.Names}} | {{.Status}}" | grep superbot >> $OUT

            echo "" >> $OUT
            echo "=== LOG SUPERBOT (ultimi 60 righe) ===" >> $OUT
            docker logs --tail 60 superbot 2>&1 >> $OUT || echo "superbot non trovato" >> $OUT

            echo "" >> $OUT
            echo "=== INSPECT SUPERBOT ===" >> $OUT
            docker inspect superbot --format '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' >> $OUT 2>/dev/null || echo "inspect fallito" >> $OUT

            echo "" >> $OUT
            echo "=== MEMORIA VPS ===" >> $OUT
            free -m | head -3 >> $OUT
            echo "" >> $OUT
            echo "=== DISCO VPS ===" >> $OUT
            df -h / >> $OUT

            echo "DONE" >> $OUT

      - name: Leggi e committa log nel repo
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_desk
          chmod 600 ~/.ssh/id_desk
          ssh -T -i ~/.ssh/id_desk \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            root@51.91.109.45 \
            'cat /tmp/diag502.txt' 2>/dev/null > deploy/diag-output.txt || echo "SSH FALLITO" > deploy/diag-output.txt
          rm -f ~/.ssh/id_desk
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git commit -m "diag: log superbot 502 [skip ci]" || true
          git push origin rule-pool || true
