name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Legge config nginx hitvprime completa
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 \
            'cat /etc/nginx/sites-enabled/hitvprime' > deploy/diag-output.txt
          rm -f ~/.ssh/id_tmp
          cat deploy/diag-output.txt

      - name: Committa nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: config hitvprime nginx [skip ci]"
          git push origin rule-pool
