name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifica post-deploy (sola lettura)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 \
            'OUT=/tmp/diag_tg.txt
            echo "=== ORA UTC: $(date -u) ===" > $OUT
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Status}}" >> $OUT
            for C in superbot-desk-hawk superbot-desk-bull; do
              echo "" >> $OUT
              echo "##### $C #####" >> $OUT
              echo "healthcheck: $(docker inspect $C --format "{{.Config.Healthcheck.Test}}")" >> $OUT
              echo "processi nel container (atteso 1 python): $(docker top $C | tail -n +2 | wc -l)" >> $OUT
              echo "righe HALT nei log: $(docker logs $C 2>&1 | grep -c HALT)" >> $OUT
              docker logs --tail 8 $C 2>&1 | cut -c1-200 | sed -E "s/bot[0-9]+:[A-Za-z0-9_-]+/bot-MASKED/g" >> $OUT
            done
            echo "" >> $OUT
            echo "--- memoria container:" >> $OUT
            docker stats --no-stream --format "{{.Name}} | {{.MemUsage}}" >> $OUT 2>&1
            awk "/MemAvailable/ {print \"MemAvailable MB:\", int(\$2/1024)}" /proc/meminfo >> $OUT
            echo "--- file dati:" >> $OUT
            ls -la --time-style=full-iso /opt/superbot-desk-data/hawk/ /opt/superbot-desk-data/bull/ >> $OUT 2>&1
            echo "FINE" >> $OUT'
          scp -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new root@51.91.109.45:/tmp/diag_tg.txt deploy/diag-output.txt
          rm -f ~/.ssh/id_tmp

      - name: Committa nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: stato finale desk [skip ci]"
          git push origin rule-pool
