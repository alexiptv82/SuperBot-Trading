name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stato container desk e fonte alert Telegram (sola lettura)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 \
            'OUT=/tmp/diag_tg.txt
            echo "=== ORA UTC: $(date -u) ===" > $OUT
            echo "=== DOCKER PS -A (superbot*) ===" >> $OUT
            docker ps -a --filter name=superbot --format "{{.Names}} | {{.Image}} | {{.Status}} | creato {{.CreatedAt}}" >> $OUT
            for C in superbot-desk superbot-desk-hawk superbot-desk-bull; do
              echo "" >> $OUT
              echo "##### $C #####" >> $OUT
              docker inspect $C --format "Status={{.State.Status}} Restarts={{.RestartCount}} Mounts: {{range .Mounts}}{{.Source}}->{{.Destination}} {{end}}" >> $OUT 2>&1
              docker inspect $C --format "{{range .Config.Env}}{{println .}}{{end}}" 2>/dev/null | grep -E "^DESK_" >> $OUT
              echo "- righe HALT nelle ultime 300 righe di log: $(docker logs --tail 300 $C 2>&1 | grep -c HALT)" >> $OUT
              echo "- ultime 12 righe log:" >> $OUT
              docker logs --tail 12 $C 2>&1 | cut -c1-220 | sed -E "s/bot[0-9]+:[A-Za-z0-9_-]+/bot-MASKED/g" >> $OUT
            done
            echo "" >> $OUT
            echo "=== FILE DATI HAWK ===" >> $OUT
            ls -la --time-style=full-iso /opt/superbot-desk-data/hawk/ >> $OUT 2>&1
            echo "=== FILE DATI BULL ===" >> $OUT
            ls -la --time-style=full-iso /opt/superbot-desk-data/bull/ >> $OUT 2>&1
            echo "=== SUPERBOT (FastAPI) ===" >> $OUT
            docker ps --filter name=^superbot$ --format "{{.Names}} | {{.Status}}" >> $OUT
            echo "FINE" >> $OUT'
          scp -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new root@51.91.109.45:/tmp/diag_tg.txt deploy/diag-output.txt
          rm -f ~/.ssh/id_tmp

      - name: Committa nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: container desk + fonte alert telegram [skip ci]"
          git push origin rule-pool
