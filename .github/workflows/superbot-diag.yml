name: SuperBot - diagnostica 502 (scrive log nel repo)

permissions:
  contents: write

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/superbot-diag.trigger"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rule-pool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifica post-deploy (sola lettura)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.91.109.45 \
            'OUT=/tmp/diag_tg.txt
            echo "=== ORA UTC: $(date -u) ===" > $OUT
            echo "--- MemAvailable (MB) letta dal preflight del deploy desk (soglia 700):" >> $OUT
            awk "/MemAvailable/ {print int(\$2/1024)}" /proc/meminfo >> $OUT
            echo "--- free -m:" >> $OUT
            free -m >> $OUT
            echo "--- docker stats (memoria per container):" >> $OUT
            docker stats --no-stream --format "{{.Name}} | {{.MemUsage}} | {{.MemPerc}}" >> $OUT 2>&1
            echo "--- disco:" >> $OUT
            df -h / | tail -1 >> $OUT
            echo "--- container desk:" >> $OUT
            docker ps -a --filter name=superbot-desk --format "{{.Names}} | {{.Status}}" >> $OUT
            echo "FINE" >> $OUT'
          scp -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new root@51.91.109.45:/tmp/diag_tg.txt deploy/diag-output.txt
          rm -f ~/.ssh/id_tmp

      - name: Committa nel repo
        run: |
          git config user.email "ci@superbot"
          git config user.name "SuperBot CI"
          git add deploy/diag-output.txt
          git diff --staged --quiet || git commit -m "diag: memoria VPS [skip ci]"
          git push origin rule-pool
