name: Deploy SuperBot to OVH
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: BITGET_API_KEY,BITGET_SECRET_KEY,BITGET_PASSPHRASE,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            apt-get install -y docker.io git curl 2>/dev/null || true
            systemctl start docker 2>/dev/null || true
            if [ -d "/opt/superbot/.git" ]; then
              cd /opt/superbot && git fetch origin && git reset --hard origin/main
            else
              git clone https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot
            fi
            cd /opt/superbot
            cat > backend/.env << EOF
BITGET_API_KEY=$BITGET_API_KEY
BITGET_SECRET_KEY=$BITGET_SECRET_KEY
BITGET_PASSPHRASE=$BITGET_PASSPHRASE
TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
TRADING_MODE=paper
INITIAL_CAPITAL=1000
MAX_LEVERAGE=10
MAX_DAILY_LOSS_PERCENT=5
MAX_OPEN_POSITIONS=3
TRADING_PAIRS=BTCUSDT,ETHUSDT,XAUUSDT,XAGUSDT
BACKEND_PORT=8001
DASHBOARD_PASSWORD=superbot2024
DB_PATH=./data/superbot.db
EOF
            mkdir -p data
            docker stop superbot 2>/dev/null || true
            docker rm superbot 2>/dev/null || true
            docker build --no-cache -t superbot .
            docker run -d \
              --name superbot \
              --restart always \
              -p 8002:8001 \
              -v /opt/superbot/data:/app/data \
              -v /opt/superbot/backend/.env:/app/backend/.env \
              superbot
            sleep 5
            curl -s http://localhost:8002/api/health && echo "BOT ONLINE OK" || echo "ERRORE AVVIO"
