name: Deploy SuperBot to OVH
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Installa dipendenze se non presenti
            apt-get update -qq
            apt-get install -y python3 python3-pip git curl
            # Clona o aggiorna il repo
            if [ -d "/opt/superbot" ]; then
              cd /opt/superbot && git pull origin main
            else
              git clone https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot
              cd /opt/superbot
            fi
            # Crea .env se non esiste
            if [ ! -f "/opt/superbot/backend/.env" ]; then
              cp /opt/superbot/.env.example /opt/superbot/backend/.env
            fi
            # Crea cartella dati
            mkdir -p /opt/superbot/data
            # Installa dipendenze Python
            cd /opt/superbot
            export PIP_NO_DEPS=0
            pip3 install --upgrade pip --break-system-packages
            pip3 install -r backend/requirements.txt \
              --break-system-packages \
              --no-deps
            pip3 install fastapi uvicorn python-dotenv \
              python-multipart ccxt sqlalchemy aiosqlite \
              httpx apscheduler pytest pytest-asyncio \
              --break-system-packages \
              --no-deps
            # Ferma bot esistente
            pkill -f "uvicorn" || true
            sleep 2
            cd /opt/superbot
            nohup python3 -m uvicorn backend.server:app \
              --host 0.0.0.0 --port 8001 \
              > /var/log/superbot.log 2>&1 &
            sleep 3
            curl -s http://localhost:8001/api/health && echo "BOT ONLINE" || echo "BOT NON RISPONDE"
            echo "Deploy completato OK"

# Deploy v3 - timeout 30m
