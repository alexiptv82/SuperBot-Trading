name: Deploy SuperBot to OVH
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Installa dipendenze se non presenti
            apt-get update -qq
            apt-get install -y python3 python3-pip git curl
            # Clona o aggiorna il repo
            if [ -d "/opt/superbot" ]; then
              cd /opt/superbot && git pull origin main
            else
              git clone https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot
              cd /opt/superbot
            fi
            # Crea .env se non esiste
            if [ ! -f "/opt/superbot/backend/.env" ]; then
              cp /opt/superbot/.env.example /opt/superbot/backend/.env
            fi
            # Crea cartella dati
            mkdir -p /opt/superbot/data
            # Installa dipendenze Python
            cd /opt/superbot
            pip3 install --upgrade pip --break-system-packages
            pip3 install fastapi==0.110.0 uvicorn==0.27.1 python-dotenv==1.0.1 python-multipart==0.0.9 --break-system-packages
            pip3 install ccxt==4.2.95 sqlalchemy==2.0.28 aiosqlite==0.20.0 --break-system-packages
            pip3 install httpx==0.27.0 apscheduler==3.10.4 --break-system-packages
            pip3 install numpy==1.26.4 --break-system-packages
            pip3 install pandas==2.2.1 --break-system-packages
            pip3 install ta==0.11.0 --break-system-packages
            # Ferma bot esistente
            pkill -f "uvicorn backend.server" || true
            sleep 2
            # Avvia bot
            cd /opt/superbot
            nohup python3 -m uvicorn backend.server:app --host 0.0.0.0 --port 8001 > /var/log/superbot.log 2>&1 &
            echo "Deploy completato OK"
