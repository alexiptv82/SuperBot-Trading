name: Deploy SuperBot to OVH

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/v05-test.yml'
      - '.github/workflows/analyze-v05-results.yml'
      - '.github/workflows/setup-ssl.yml'
      - '.github/workflows/check-pwa.yml'
      - '.github/workflows/main-phase1-test.yml'
      - '.github/workflows/analyze-phase1-results.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: 51.91.109.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: BITGET_API_KEY,BITGET_SECRET_KEY,BITGET_PASSPHRASE,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,DASHBOARD_PASSWORD
          script: |
            # Password iniziale della dashboard (GitHub Secret). Senza, ci si
            # ferma QUI, prima di toccare il bot in esecuzione.
            if [ -z "$DASHBOARD_PASSWORD" ]; then
              echo "ERRORE: GitHub Secret DASHBOARD_PASSWORD mancante. Crealo in Settings > Secrets and variables > Actions e rilancia il deploy."
              exit 1
            fi
            apt-get install -y docker.io git curl nginx nodejs npm 2>/dev/null || true
            systemctl start docker 2>/dev/null || true
            # == DATABASE: dato vivo, da non perdere mai ==
            # In passato data/superbot.db era tracciato da git e il
            # "git reset --hard" qui sotto lo sostituiva ad OGNI deploy con la
            # copia del repository: sparivano password, impostazioni di rischio
            # e storico. Ora il file non e' piu' nel repository, ma per
            # sicurezza: (1) copia consistente PRIMA del reset, tenuta in
            # /opt/superbot-backups (ultime 10), (2) se dopo il reset il file
            # manca o git lo gestisce ancora, si rimette quella copia.
            DB_LIVE=/opt/superbot/data/superbot.db
            DB_KEEP=/tmp/superbot-db-keep.$$
            mkdir -p /opt/superbot-backups
            if [ -s "$DB_LIVE" ]; then
              python3 -c "import sqlite3,sys; s=sqlite3.connect(sys.argv[1]); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close(); s.close()" "$DB_LIVE" "$DB_KEEP" 2>/dev/null || cp "$DB_LIVE" "$DB_KEEP"
              cp "$DB_KEEP" "/opt/superbot-backups/superbot-$(date +%Y%m%d-%H%M%S).db"
              ls -1t /opt/superbot-backups/superbot-*.db 2>/dev/null | tail -n +11 | xargs -r rm -f
              echo "DB: copia di sicurezza fatta"
            fi
            if [ -d "/opt/superbot/.git" ]; then
              cd /opt/superbot && git fetch origin && git reset --hard origin/main
            else
              git clone https://github.com/alexiptv82/SuperBot-Trading.git /opt/superbot
            fi
            cd /opt/superbot
            if [ -s "$DB_KEEP" ] && { [ ! -f "$DB_LIVE" ] || git ls-files --error-unmatch data/superbot.db >/dev/null 2>&1; }; then
              mkdir -p data && cp "$DB_KEEP" "$DB_LIVE" && echo "DB: ripristinato dopo il reset di git"
            fi
            rm -f "$DB_KEEP"
            printf "BITGET_API_KEY=%s\nBITGET_SECRET_KEY=%s\nBITGET_PASSPHRASE=%s\nTELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nTRADING_MODE=paper\nINITIAL_CAPITAL=1000\nMAX_LEVERAGE=10\nMAX_DAILY_LOSS_PERCENT=5\nMAX_OPEN_POSITIONS=3\nTRADING_PAIRS=BTCUSDT,ETHUSDT,XAUUSDT,XAGUSDT\nBACKEND_PORT=8001\nDASHBOARD_PASSWORD_B64=%s\nWEBAUTHN_RP_ID=superbot-trading.duckdns.org\nWEBAUTHN_ORIGIN=https://superbot-trading.duckdns.org\nWEBAUTHN_RP_NAME=SuperBot\nDB_PATH=./data/superbot.db\n" "$BITGET_API_KEY" "$BITGET_SECRET_KEY" "$BITGET_PASSPHRASE" "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" "$(printf %s "$DASHBOARD_PASSWORD" | base64 -w0)" > backend/.env
            mkdir -p data
            # Build reale del frontend ad ogni deploy: prima d'ora
            # frontend/build sul VPS era una build manuale vecchia, mai
            # aggiornata automaticamente, quindi mancavano anche gli asset
            # della PWA (manifest/service worker/icone). BACKEND_URL vuoto
            # fa usare richieste relative (stesso dominio, via il proxy
            # /api di nginx) cosi' funziona sia su HTTP che su HTTPS senza
            # problemi di mixed-content.
            cd frontend
            REACT_APP_BACKEND_URL= npm install --no-audit --no-fund
            REACT_APP_BACKEND_URL= npm run build
            cd ..
            cp nginx.conf /etc/nginx/sites-available/superbot
            ln -sf /etc/nginx/sites-available/superbot /etc/nginx/sites-enabled/superbot
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl restart nginx || true
            docker stop superbot 2>/dev/null || true
            docker rm superbot 2>/dev/null || true
            docker build --no-cache -t superbot .
            docker run -d \
              --name superbot \
              --restart always \
              -p 8002:8001 \
              -v /opt/superbot/data:/app/data \
              -v /opt/superbot/backend/.env:/app/backend/.env \
              superbot
            sleep 5
            curl -s http://localhost:8002/api/health && echo "BOT ONLINE OK" || echo "ERRORE AVVIO"
            systemctl is-active nginx && echo "NGINX OK" || echo "NGINX NON ATTIVO"
