name: Sala segnali - test baseline 5818 con motore corretto e Salvadanaio
on:
  push:
    branches: [rule-pool, work/classici-5818-vault-20261027]
    paths: ['.github/workflows/desk-ci.yml', 'Dockerfile.desk', 'backend/desk/**', 'backend/tests/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt==4.2.95 pandas numpy pytest
      - name: Baseline, engine fixes, LONG and vault-only accounting
        # Later slot6/C63, percentage sizing, P1/P2/regime and observation-mode
        # integration tests describe intentionally removed policies. Their source
        # stays in history/repository; active contracts are tested here explicitly.
        run: >-
          python -m pytest -q
          tests/test_desk.py tests/test_desk_macro.py tests/test_desk_hours.py
          tests/test_desk_fixes_2026_10_20.py tests/test_profit_correctness_proposals.py
          tests/test_classic_rollback_vault.py tests/test_capital_journal_v1.py
      - name: Unchanged live adapters (fake exchange only, no bot live mode)
        run: python -m pytest -q tests/test_live_connector.py tests/test_live_sync.py tests/test_live_selftest.py
      - name: Unchanged rule pool
        run: python -m pytest -q tests/test_rule_pool_runner.py
      - name: Deploy safety guards (fake docker only)
        working-directory: .
        run: python -m unittest deploy/scripts/test_deploy_workflow.py deploy/scripts/test_fix_a_deploy_guards.py
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build immagine
        run: docker build -t superbot-desk -f Dockerfile.desk .
      - name: Import sanity check
        run: |
          docker run --rm superbot-desk python -c "
          from desk.engine import Limits, PaperAccount
          from desk.signals import read_symbol
          from desk.brain import call_claude, build_prompt, rules_decisions
          from desk.market_context import fetch_all_context
          from desk import cli
          print('Import OK')
          a = PaperAccount(Limits())
          p, msg = a.open('BTC', 1, 100, 10, 100.0, 98.0, None, 0, {})
          assert p is not None, f'open fallito: {msg}'
          print(f'PaperAccount OK — margin={p.margin}  leverage={p.leverage}')
          "
