name: Sala segnali - test (nessun deploy, nessun segreto)

on:
  push:
    branches: [rule-pool]
    paths:
      - ".github/workflows/desk-ci.yml"
      - "Dockerfile.desk"
      - "backend/desk/**"
      - "backend/rule_pool/**"
      - "backend/tests/test_desk.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt==4.2.95 pandas numpy pytest
      - name: Unit tests (solo test_desk.py per diagnostica)
        run: python -m pytest tests/test_desk.py -v --tb=long 2>&1
      - name: Unit tests (rule_pool)
        if: always()
        run: python -m pytest tests/test_rule_pool_runner.py -v --tb=short 2>&1
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build immagine
        run: docker build -t superbot-desk -f Dockerfile.desk .
      - name: Avvio a vuoto (report e salute)
        run: |
          docker run --rm superbot-desk python -m desk.cli report --data-dir /tmp/desk-test
          docker run --rm superbot-desk sh -c "python -m desk.cli health --data-dir /tmp/desk-test; test \$? -eq 1"
