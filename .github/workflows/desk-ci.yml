name: Sala segnali - test (nessun deploy, nessun segreto)

on:
  push:
    branches: [rule-pool]
    paths:
      - ".github/workflows/desk-ci.yml"
      - "Dockerfile.desk"
      - "backend/desk/**"
      - "backend/rule_pool/**"
      - "backend/tests/test_desk.py"
      - "backend/tests/test_desk_macro.py"
      - "backend/tests/test_desk_hours.py"
      - "backend/tests/test_desk_analyst.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_live_*.py"
      - "backend/tests/fake_bitget.py"
      - "backend/tests/test_bull_*.py"
      - "backend/tests/test_prompt_account_line_*.py"
      - "backend/tests/test_desk_fixes_*.py"
      - "backend/tests/test_data_fixes_*.py"
      - "backend/tests/test_pm_exec_replay_*.py"
      - "deploy/scripts/pm_exec_replay.py"
      - "backend/tests/test_stop_buckets_*.py"
      - "deploy/scripts/stop_buckets.py"
      - ".github/workflows/desk-deploy.yml"
      - "deploy/scripts/test_deploy_workflow.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt==4.2.95 pandas numpy pytest
      - name: Unit tests (collegamento live, exchange finto con vero ccxt)
        run: python -m pytest tests/test_live_connector.py tests/test_live_sync.py tests/test_live_selftest.py tests/test_live_cycle.py -v --tb=short
      - name: Unit tests (desk)
        id: desk_tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_desk.py tests/test_desk_macro.py tests/test_desk_hours.py tests/test_desk_analyst.py -v --tb=long 2>&1 | tee /tmp/pytest_out.txt
          exit ${PIPESTATUS[0]}
      - name: Pubblica errori come annotations
        if: always()
        run: |
          python3 - <<'PYEOF'
          import re, sys
          try:
              with open("/tmp/pytest_out.txt") as f:
                  content = f.read()
          except FileNotFoundError:
              sys.exit(0)
          # stampa tutto nel log
          print(content)
          # emetti annotations per ogni FAILED
          for line in content.splitlines():
              if line.startswith("FAILED") or "ERROR" in line[:10]:
                  safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error::{safe}")
          # summary
          with open("/tmp/pytest_out.txt") as f:
              txt = f.read()
          import os
          sf = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if sf:
              with open(sf, "a") as s:
                  s.write("```\n" + txt[-8000:] + "\n```\n")
          PYEOF
      - name: Fallisci se i test sono falliti
        if: steps.desk_tests.outcome == 'failure'
        run: exit 1
      - name: Unit tests (rule_pool)
        run: python -m pytest tests/test_rule_pool_runner.py -v --tb=short
      - name: Unit tests (regole di gestione Bull/Hawk e correzioni dati del 20-21/10/2026, un processo per file)
        # Prima non giravano in CI: se qualcuno cambiava slot, margini o leva, questi test restavano ad
        # affermare i valori vecchi senza che nessuno se ne accorgesse. Un processo per file perche' alcuni
        # sostituiscono moduli in sys.modules.
        run: |
          set -e
          for f in test_bull_slots_2026_10_20 test_bull_margin_gate_2026_10_20 test_bull_leverage_gate_2026_10_20 test_prompt_account_line_2026_10_20 test_desk_fixes_2026_10_20 test_data_fixes_2026_10_21 test_pm_exec_replay_2026_10_21 test_stop_buckets_2026_10_21; do
            python -m pytest tests/$f.py -q -p no:cacheprovider
          done
      - name: Prove del workflow di rilascio dei bot (docker finto, nessun server)
        working-directory: .
        run: python -m unittest deploy/scripts/test_deploy_workflow.py
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build immagine
        run: docker build -t superbot-desk -f Dockerfile.desk .
      - name: Import sanity check
        run: |
          docker run --rm superbot-desk python -c "
          from desk.engine import Limits, PaperAccount
          from desk.signals import read_symbol
          from desk.brain import call_claude, build_prompt, rules_decisions
          from desk.market_context import fetch_all_context
          from desk import cli
          print('Import OK')
          a = PaperAccount(Limits())
          p, msg = a.open('BTC', 1, 100, 10, 100.0, 98.0, None, 0, {})
          assert p is not None, f'open fallito: {msg}'
          print(f'PaperAccount OK — margin={p.margin}  leverage={p.leverage}')
          "
