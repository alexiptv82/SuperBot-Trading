name: SuperBot age V2 - controllo isolato della chiave (solo chiave pubblica derivata)

# PREPARATO, NON ESEGUITO. Verifica che il Secret SUPERBOT_AGE_RECOVERY_KEY_V2 appartenga alla coppia il cui destinatario PUBBLICO
# fu documentato il 23 ottobre 2026 (commit e51cf721196bdd52bce39b925a3b7521e64e141a), e che la coppia funzioni (cifratura e
# decifratura di 4 KiB casuali). Nei log compare soltanto ESITO ... OK/NO.
#
# ATTENZIONE - Secrets: SUPERBOT_AGE_RECOVERY_KEY_V2 e' oggi un Secret di REPOSITORY. L'ambiente "age-recovery" protegge SOLO i
# Secrets definiti NELL'AMBIENTE: un Secret di repository resta leggibile da qualunque workflow del repository, su qualunque ramo,
# senza approvazione. Questo workflow NON rende protetto quel Secret e non puo' dire dove sia memorizzato (il GITHUB_TOKEN non
# elenca i Secrets). Finche' non e' stato sostituito da un Secret di ambiente (e quello di repository cancellato) NON va descritto
# come protetto. Vedi deploy/extbackup/age-v2-migration/SEGRETI-E-PROTEZIONI.md.
# Avvio: workflow_dispatch funziona solo se questo file e' sul ramo predefinito (non lo spostiamo senza decisione del proprietario);
# il percorso supportato oggi e' il push del file KEYCHECK.trigger sul ramo di esecuzione.
#
# Garanzie (verificate da deploy/scripts/test_age_v2_recovery.py):
#  - NESSUN accesso a VPS, a repository privati o a archivi; nessuna azione di terze parti (nessun "uses:"); nessun artifact;
#  - UN solo Secret (SUPERBOT_AGE_RECOVERY_KEY_V2), visibile a UN solo passo, che lo scrive su un file 600 senza leggerlo ne' stamparlo;
#  - il programma che lo usa non apre mai quel file: ne passa il percorso ad age;
#  - NON parte da sola: serve workflow_dispatch con l'impronta di approvazione, oppure il push del file KEYCHECK.trigger su un ramo di
#    ESECUZIONE (work/age-v2-keycheck-run-20261110) che questo commit non contiene. Pubblicare questo file non esegue nulla.
# Consigliato: ambiente "age-recovery" con revisore obbligatorio e rami consentiti limitati (vedi deploy/extbackup/age-v2-recovery/LEGGIMI.md).

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Impronta di approvazione (sha256 di workflow + script) - vedi LEGGIMI.md"
        required: true
        type: string
  push:
    branches: [work/age-v2-keycheck-run-20261110]
    paths:
      - "deploy/extbackup/age-v2-recovery/KEYCHECK.trigger"

permissions:
  contents: read

concurrency:
  group: superbot-age-v2-key-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: age-recovery
    steps:
      - name: Fonti verificate e approvazione (nessun Secret in questo passo)
        shell: bash
        env:
          DOC_SHA: e51cf721196bdd52bce39b925a3b7521e64e141a
          DOC_RECIPIENT_SHA256: 44181f934cf820d4c6b8ec1ee9a77f8b74a44a7d23f6bf66681e34e010bece18
          INPUT_APPROVAL: ${{ github.event.inputs.approval }}
        run: |
          set -euo pipefail
          umask 077
          fetch() {
            git init -q "$1"
            git -C "$1" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$1" fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q FETCH_HEAD
            [ "$(git -C "$1" rev-parse HEAD)" = "$2" ] || { echo "BLOCCO: commit diverso da quello fissato"; exit 1; }
          }
          fetch "$RUNNER_TEMP/wf" "$GITHUB_SHA"
          fetch "$RUNNER_TEMP/doc" "$DOC_SHA"
          R="deploy/extbackup/recipient-v2.txt"
          [ "$(sha256sum "$RUNNER_TEMP/doc/$R" | cut -d' ' -f1)" = "$DOC_RECIPIENT_SHA256" ] || { echo "BLOCCO: il destinatario documentato non e' quello atteso"; exit 1; }
          WF=$(sha256sum "$RUNNER_TEMP/wf/.github/workflows/age-v2-key-check.yml" | cut -d' ' -f1)
          SC=$(sha256sum "$RUNNER_TEMP/wf/deploy/extbackup/age-v2-recovery/check_key.py" | cut -d' ' -f1)
          GOT=$(printf '%s\n%s\n' "$WF" "$SC" | sha256sum | cut -d' ' -f1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            WANT="$INPUT_APPROVAL"
          else
            WANT=$(sed -n 's/^approval=\([0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/wf/deploy/extbackup/age-v2-recovery/KEYCHECK.trigger" | head -n1)
          fi
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]] && [ "$WANT" = "$GOT" ] || {
            echo "BLOCCO: impronta di approvazione mancante o diversa dai file di questo commit. Nessun Secret e' stato usato."
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          echo "FONTI_E_APPROVAZIONE=OK"

      - name: Chiave V2 (viene solo scritta su un file 600, mai letta ne' stampata)
        shell: bash
        env:
          AGE_RECOVERY_KEY_V2: ${{ secrets.SUPERBOT_AGE_RECOVERY_KEY_V2 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AGE_RECOVERY_KEY_V2" || { echo "ESITO chiave V2 presente: NO"; exit 1; }
          printf '%s\n' "$AGE_RECOVERY_KEY_V2" > "$RUNNER_TEMP/age-v2-identity"
          chmod 600 "$RUNNER_TEMP/age-v2-identity"
          echo "ESITO chiave V2 presente: OK"

      - name: Confronto con il destinatario documentato e prova della coppia (rapporto a frasi fisse)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/wf/deploy/extbackup/age-v2-recovery/check_key.py" \
            --identity "$RUNNER_TEMP/age-v2-identity" \
            --recipients "$RUNNER_TEMP/doc/deploy/extbackup/recipient-v2.txt" \
            --current-recipients "$RUNNER_TEMP/wf/deploy/extbackup/recipient-v2.txt" \
            --work "$RUNNER_TEMP/work" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Rimozione di chiave e file temporanei
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/age-v2-identity" || true
          rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/wf" "$RUNNER_TEMP/doc" || true
