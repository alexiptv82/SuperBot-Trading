name: SuperBot RC84 - close-only PUBLIC release preflight (no change)
on:
  push:
    branches: [main]
    paths: ['deploy/rc84-close-only-release-preflight.trigger']
permissions:
  contents: read
concurrency:
  group: superbot-public-singapore-cutover
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'alexiptv82/SuperBot-Trading'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '6a0a9e86c3df6422711958cd297ca7f5ef55bd45'
      - name: Verify pinned release script and Python syntax (NO changes)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6a0a9e86c3df6422711958cd297ca7f5ef55bd45'
          python3 - <<'PY'
          import ast,pathlib
          for file in ('deploy/scripts/rc84-publish-single-close-only-paper.py',
                       'backend/v3/close_bridge_server.py',
                       'backend/v3/close_bridge.py',
                       'backend/v3/cutover_gate.py'):
              ast.parse(pathlib.Path(file).read_text(), filename=file)
          print('RC84_CLOSE_ONLY_RELEASE_SYNTAX=PASS')
          PY
      - name: Verify CURRENT public web and PAPER/rollback state on Singapore (READ ONLY)
        shell: bash
        env:
          SG_SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SG_SSH_KEY:-}" || exit 2
          install -d -m 0700 "$RUNNER_TEMP/sg"
          KEY="$RUNNER_TEMP/sg/id"
          HOSTS="$RUNNER_TEMP/sg/hosts"
          printf '%s\n' "$SG_SSH_KEY" > "$KEY"
          chmod 0600 "$KEY"
          printf '%s\n' '51.79.205.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMfbyIlrK+PvKl6c58E140wSE5E+8arc36/uL3AFKgj' > "$HOSTS"
          chmod 0600 "$HOSTS"
          trap 'rm -f "$KEY"' EXIT
          ssh -T -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$HOSTS" -o ConnectTimeout=20 \
            root@51.79.205.82 \
            'PYTHONDONTWRITEBYTECODE=1 python3 -I - --preflight' \
            < deploy/scripts/rc84-publish-single-close-only-paper.py
          echo RC84_SINGLE_CLOSE_PUBLIC_PREFLIGHT_ONLY=PASS
