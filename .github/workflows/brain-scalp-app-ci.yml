name: Brain Scalp app - read-only offline CI
on:
  push:
    branches: [work/brain-scalp-dual-app-20261028]
    paths:
      - 'backend/brain_scalp_view.py'
      - 'backend/brain_scalp_api.py'
      - 'backend/server.py'
      - 'backend/tests/test_brain_scalp_view.py'
      - 'frontend/src/**'
      - '.github/workflows/brain-scalp-app-ci.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.110.0 httpx==0.27.0
      - run: PYTHONPATH=backend python -m unittest -v backend.tests.test_brain_scalp_view
      - run: python -m compileall -q backend/brain_scalp_api.py backend/brain_scalp_view.py backend/server.py
      - name: Guard classical bot, legacy reader and deploy
        run: |
          test -z "$(git diff --name-only 2283bfb1c63959015658904a75d68d6587cca314 HEAD -- backend/desk backend/brain_free_view.py backend/brain_free_api.py deploy .github/workflows/deploy.yml)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
        env:
          CI: 'true'
