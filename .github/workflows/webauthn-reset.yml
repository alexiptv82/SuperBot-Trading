name: SuperBot - reset credenziali WebAuthn

on:
  push:
    branches: [rule-pool]
    paths:
      - "deploy/webauthn-reset.trigger"

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancella credenziali WebAuthn vecchio dominio
        env:
          SSH_KEY: ${{ secrets.SINGAPORE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_tmp
          chmod 600 ~/.ssh/id_tmp
          ssh -i ~/.ssh/id_tmp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 root@51.79.205.82 "echo '' | base64 -d | python3"
          rm -f ~/.ssh/id_tmp
